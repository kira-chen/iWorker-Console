# 提交自动体检（GitHub Actions）
# ============================================================================
# 【这是什么】
# 每次有人把代码推上 GitHub，GitHub 就用它自己的机器自动跑一遍单测与构建，
# 结果直接标在提交旁边：✅ 绿勾 = 没问题，❌ 红叉 = 有问题点进去看日志。
#
# 【为什么加】
# 2026-09-10：一次直推 main 的提交带着 2 个白屏页面（computed 未 import）和
# 22 条测试失败进了主干，另一路开发 pull 到后被迫停摆半天。根因不是没规矩
# （CLAUDE.md 早就写了「commit 前全量测试须绿」），而是规矩靠人自觉、漏跑了没人拦。
# 装上这个之后，跑不跑测试不再取决于是否记得。
#
# 【它拦不拦】
# 这个文件本身只体检、不改代码；「红叉能不能拦住合并」取决于 GitHub 网页上的
# 分支保护规则（Settings → Branches），不由本文件决定：
#   - 未配保护规则时：红叉只是提示，代码照样进 main（2026-09-15 前的状态）；
#   - 配了「Require status checks」后：PR 在 CI 绿之前无法合并，坏代码进不了主干。
# 配置步骤与日常流程见 CLAUDE.md「Git 协作」一节。
#
# 【费用】私有仓库每月 2000 分钟免费额度；本项目单次约 3-5 分钟，用不完。
name: CI

# 触发时机（2026-09-15 去重优化）：
#   - push 只认 main：main 的直推仍然体检；
#   - 其余分支一律走 pull_request 事件。
# 为什么不再用 branches: ['**']：那样在 PR 分支上推一次会同时触发 push 与 pull_request 两轮，
# 跑的是同一份东西，白烧一倍额度与等待时间。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支上连着推几次时，前面那几轮结果已经没意义了 —— 新的一推自动掐掉还在跑的旧运行。
# 效果：连推三次只会跑完最后一次。group 按「工作流 + 分支/PR」区分，不会误伤别人的分支。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单测 + 构建
    runs-on: ubuntu-latest
    # 正常 3-5 分钟；卡死时不至于空耗额度
    timeout-minutes: 15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 准备 Node 环境
        uses: actions/setup-node@v7
        with:
          # 【刻意与本机不同】本机是 Node 26，这里钉 22：CI 当「低版本兵棋」用，
          # 专门拦住那些只在新 Node 上恰好能跑的写法（2026-09-15 负责人裁定保留 22）。
          # 已实证过一次：globalThis.localStorage = 桩 这种直接赋值在本机 26 生效、在 22 上静默失效，
          # 本地全绿而 CI 红 4 条（CI#13）。代价是这类问题本地复现不了，得看 CI 日志。
          node-version: '22'
          # 缓存 npm 依赖，第二次以后快很多
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        # npm ci 严格按 package-lock 安装，比 npm install 快且可复现
        run: npm ci

      - name: 跑单元测试
        working-directory: frontend
        # 就是本地的 npm run test（vitest run，约 1834 条用例）
        # TZ 与本机开发环境保持一致，避免 fmtMinute() 等本地时间方法在 UTC 机器上跑出不同结果
        env:
          TZ: Asia/Shanghai
        run: npm run test

      - name: 核验待办状态与 commit 说明一致
        # commit 说明里写了「关闭待办 xx#n」的，对应行必须已在该人待办文件的「已处理」表里
        # （本地 post-commit 钩子会自动搬；没装钩子就会在这里红）。见 scripts/todo.mjs。
        # PR 事件下比对 base..head 的全部 commit；push 到 main 时只看本次推送范围。
        run: |
          RANGE="${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.event.pull_request.head.sha || github.sha }}"
          git fetch --no-tags --depth=200 origin ${{ github.event.pull_request.base.ref || github.ref_name }} 2>/dev/null || true
          MSGS=$(git log --format=%B "$RANGE" 2>/dev/null || git log -1 --format=%B)
          node scripts/todo.mjs verify "$MSGS"

      - name: 跑生产构建
        working-directory: frontend
        # 单测过了不代表能构建出来，两道都要过
        run: npm run build
