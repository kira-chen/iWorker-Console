    /* Taste-skill audit: targeted evolution for a dense enterprise admin surface. */
    :root{--green:#078b61;--green-hover:#067650;--green-soft:#eaf6f1;--text:#2e3431;--strong:#1f2924;--muted:#68736d;--faint:#909a94;--line:#dfe5e1;--line-soft:#edf1ef;--sunken:#f6f8f7;--shadow:0 16px 42px rgba(27,48,39,.16);--radius:8px}
    body{background:#f4f6f5;letter-spacing:.01em}
    .main{background:#f6f8f7}
    .page{max-width:1480px;margin:0 auto}
    .page-head h1{font-size:25px;font-weight:650;letter-spacing:-.02em}
    .page-head p{color:#68736d}
    .tabs{margin-top:30px}
    .toolbar{height:74px}
    .input,.select,.textarea,.plain,.primary,.section-card,.import-box,.tool,.result,.modal,.toast{border-radius:8px}
    .input,.select{height:38px}
    .input,.select,.textarea{border-color:#d6ddd9;background:#fff}
    .input:hover,.select:hover,.textarea:hover{border-color:#aebbb4}
    .input:focus,.select:focus,.textarea:focus{border-color:#078b61;box-shadow:0 0 0 3px rgba(7,139,97,.12)}
    button:active{transform:scale(.98)}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #078b61;outline-offset:2px}
    .primary{height:38px;padding:0 18px;box-shadow:0 1px 2px rgba(7,85,59,.18);white-space:nowrap}
    .plain{height:38px;white-space:nowrap}
    .table-wrap{border:1px solid #e1e6e3;border-radius:10px;background:#fff;overflow:hidden}
    .table th{height:48px;background:#f2f5f3;color:#59645e;font-size:13px}
    .table td{height:60px}
    .table tbody tr{transition:background-color .15s ease}
    .table tbody tr:hover td{background:#f7faf8}
    .drawer{width:min(780px,88vw);background:#f5f7f6}
    .drawer-head{height:66px;flex-basis:66px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);padding:0 28px}
    .drawer-head h2{font-size:19px;font-weight:650;letter-spacing:-.015em}
    .drawer-body{padding:22px 28px 34px}
    .drawer-foot{height:66px;flex-basis:66px;padding:0 28px;background:rgba(255,255,255,.96)}
    .drawer-body>.section-card{margin-bottom:20px;border-color:#dde4e0;border-radius:10px;padding:0 20px 20px;box-shadow:0 1px 3px rgba(34,55,46,.045)}
    .section-card>.section-title,.section-card>.tools-head{min-height:52px;margin:0 -20px 20px;padding:0 20px;background:#f8faf9;border-bottom-color:#e5ebe8}
    .section-card>.section-title{font-size:15px;font-weight:650}
    .section-sub{color:#748079;line-height:1.5}
    .section-card .form-grid{gap:18px 22px}
    .label{margin-bottom:8px;color:#39433e;font-weight:500}
    .hint{color:#758079;line-height:1.5}
    .import-box{padding:15px 17px;border-color:#cfd9d4;background:#f9fbfa}
    .import-title{font-weight:650}
    .import-desc{color:#707b75}
    .import-body{display:block;max-height:0;margin-top:0;opacity:0;overflow:hidden;transform:translateY(-4px);transition:max-height .24s cubic-bezier(.16,1,.3,1),opacity .18s ease,transform .18s ease,margin-top .18s ease}
    .import-body.open{max-height:220px;margin-top:14px;opacity:1;transform:none}
    .tools-body{display:block;max-height:0;opacity:0;overflow:hidden;transform:translateY(-4px);transition:max-height .32s cubic-bezier(.16,1,.3,1),opacity .2s ease,transform .2s ease}
    .tools-body.open{max-height:1800px;opacity:1;transform:none}
    .tool{gap:11px;margin-top:10px;padding:15px 16px;border-color:#e0e6e3;background:#fbfcfb;box-shadow:none}
    .tool:hover,.tool:focus-within{border-color:#9ccdb9;background:#fff;box-shadow:0 5px 18px rgba(28,74,55,.07);transform:translateY(-1px)}
    .tool-title{font-size:13px}
    .tool-desc{color:#56615b}
    .schema-toggle{font-weight:500}
    .tool .schema{display:block;max-height:0;padding:0 10px;border-color:transparent;opacity:0;overflow:hidden;transform:translateY(-4px);transition:max-height .26s cubic-bezier(.16,1,.3,1),opacity .18s ease,transform .18s ease,padding .18s ease,border-color .18s ease}
    .tool:hover .schema,.tool:focus-within .schema,.tool .schema.open{max-height:360px;padding:6px 10px;border-color:#e0e5e2;opacity:1;transform:none}
    .schema-row{padding:8px 0}
    .reference-section{margin:24px 3px 18px}
    .page-time{margin-top:4px;padding-top:14px;color:#7c8781}
    .mask.open{animation:tasteFadeIn .2s ease both}
    .mask.open .drawer{animation:tasteDrawerIn .28s cubic-bezier(.16,1,.3,1) both}
    .drawer.closing{animation:tasteDrawerOut .18s ease both!important}
    @keyframes tasteFadeIn{from{opacity:0}to{opacity:1}}
    @keyframes tasteDrawerIn{from{transform:translateX(28px);opacity:.72}to{transform:none;opacity:1}}
    @keyframes tasteDrawerOut{to{transform:translateX(22px);opacity:0}}
    @media(max-width:720px){.drawer{width:96vw}.drawer-body{padding:18px}.drawer-head,.drawer-foot{padding-left:20px;padding-right:20px}.section-card .form-grid{grid-template-columns:1fr}.import-desc,.section-sub{display:block;margin:4px 0 0}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  
    /* Field hierarchy pass: keep decision-critical information in the main scan path. */
    .compact-mcp-table .service-summary{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:8px;row-gap:4px;align-items:center}
    .compact-mcp-table .mcp-name{grid-column:1/-1}
    .compact-mcp-table .service-description{grid-column:2;color:#6f7974;font-size:12px;line-height:1.45}
    .compact-mcp-table .transport{grid-column:2;justify-self:start;margin-top:1px}
    .compact-mcp-table .tools-count{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
    .compact-mcp-table .updated-cell{color:#64706a;font-variant-numeric:tabular-nums}
    .compact-mcp-table .muted-value{color:#8b958f}
    .status-connection{display:flex;align-items:center}.mcp-name .ellipsis{min-width:0}.mcp-name .tag{flex:0 0 auto;margin-left:2px}.extra-params-field{margin-top:18px}
    .status-connection .verify{gap:6px;color:#4f5b55}
    .status-connection .verify small{color:#88928d}
    .advanced-settings{grid-column:1/-1;margin-top:2px;border-top:1px solid #e8ecea;padding-top:12px}
    .advanced-settings summary{width:max-content;cursor:pointer;color:#078b61;font-weight:500;list-style:none}
    .advanced-settings summary::-webkit-details-marker{display:none}
    .advanced-settings summary:before{content:"›";display:inline-block;margin-right:6px;transition:transform .18s ease}
    .advanced-settings[open] summary:before{transform:rotate(90deg)}
    .advanced-body{max-width:320px;padding-top:14px}
    @media(max-width:1100px){.compact-mcp-table{min-width:1080px}}
  
    /* Confirmed information order for MCP editing. */
    .basic-info-grid .field.full{grid-column:1/-1}
    .basic-info-grid .compact-icon-row{min-height:38px}
    .connection-transport{margin-bottom:18px}
    .connection-check-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px}
    .connection-check-row .connection-meta{margin:0}
    .connection-check-row .conn-actions{margin:0}
    .connection-timeout{max-width:340px;margin-top:18px;padding-top:18px;border-top:1px solid #e6ebe8}
    .schema-toggle span:last-child{font-weight:500}

function expertActions(r){let locked=!!r.pendingAction;if(locked)return `<button class="link" data-action="expert-view" data-id="${r.id}">查看</button><button class="link" data-action="expert-edit" data-id="${r.id}" disabled title="审核中不可编辑">编辑</button><button class="warning-link" data-action="expert-version" data-id="${r.id}">撤回</button>`;if(r.status==='draft')return `<button class="link" data-action="expert-view" data-id="${r.id}">查看</button><button class="link" data-action="expert-edit" data-id="${r.id}">编辑</button><button class="link" data-action="expert-version" data-id="${r.id}">发布</button><button class="danger-link" data-action="expert-delete" data-id="${r.id}">删除</button>`;return `<button class="link" data-action="expert-view" data-id="${r.id}">查看</button><button class="link" data-action="expert-edit" data-id="${r.id}">编辑</button><button class="warning-link" data-action="expert-stop" data-id="${r.id}">停用</button><button class="link" data-action="expert-version" data-id="${r.id}">版本管理</button>`}
function renderExperts(){let q=state.expertKeyword.toLowerCase(),list=expertRows.filter(r=>(!q||[r.name,r.intro].some(v=>v.toLowerCase().includes(q)))&&(!state.expertStatus||(state.expertStatus==='review'?!!r.pendingAction:!r.pendingAction&&r.status===state.expertStatus))).sort((a,b)=>state.expertSort==='desc'?b.updated.localeCompare(a.updated):a.updated.localeCompare(b.updated));var totalExperts=list.length;list=pageSlice(list,'experts');view.innerHTML=`<div class="module-toolbar"><div class="search"><input class="input" id="expertSearch" value="${esc(state.expertKeyword)}" placeholder="搜索专家名或专家描述"></div><div class="select-wrap"><select class="select" id="expertStatus"><option value="">全部状态</option><option value="draft" ${state.expertStatus==='draft'?'selected':''}>未发布</option><option value="review" ${state.expertStatus==='review'?'selected':''}>审核中</option><option value="published" ${state.expertStatus==='published'?'selected':''}>已发布</option></select></div><button class="plain" data-action="expert-query">查询</button><span class="toolbar-spacer"></span><button class="primary" data-action="expert-new">＋ 新建专家</button></div>${list.length?`<div class="table-wrap"><table class="table expert-table"><colgroup><col style="width:250px"><col style="width:300px"><col style="width:75px"><col style="width:95px"><col style="width:150px"><col style="width:280px"></colgroup><thead><tr><th>专家名</th><th>专家描述</th><th>技能数</th><th>最新版本</th><th><button class="sort" data-action="expert-time-sort">最近更新时间 ${state.expertSort==='desc'?'↓':'↑'}</button></th><th>操作</th></tr></thead><tbody>${list.map(r=>{let v=expertView(r);return `<tr><td><div class="expert-primary"><span class="expert-avatar">${r.avatar}</span><span class="expert-name-line"><span class="expert-name-text" title="${esc(r.name)}">${esc(r.name)}</span><span class="status-neutral ${v.cls}">${v.label}</span></span></div></td><td><span class="ellipsis" title="${esc(r.intro)}">${esc(r.intro)}</span></td><td class="tools-count">${r.skillIds.length}</td><td>${r.version||'<span class="muted-value">-</span>'}</td><td>${r.updated}</td><td><div class="ops">${expertActions(r)}</div></td></tr>`}).join('')}</tbody></table></div>${pagerHtml('experts',totalExperts)}`:'<div class="empty">还没有专家，点击「新建专家」创建第一个</div>'}`}
function roleScopeLines(perms){return permissionGroups.map(s=>{if(s.scope==='管理端'){let p=s.groups.flatMap(g=>g.pages).filter(x=>perms.includes(x));return p.length?{scope:s.scope,detail:p.join('、')}:null}let p=s.groups.flatMap(g=>g.pages).filter(x=>perms.includes(x));return p.length?{scope:s.scope,detail:''}:null}).filter(Boolean)}
function renderRoles(){let q=state.roleKeyword.toLowerCase(),list=roleRows.filter(r=>!q||r.name.toLowerCase().includes(q)).sort((a,b)=>state.roleSort==='desc'?b.updated.localeCompare(a.updated):a.updated.localeCompare(b.updated));var totalRoles=list.length;list=pageSlice(list,'roles');view.innerHTML=`<div class="module-toolbar"><div class="search"><input class="input" id="roleSearch" value="${esc(state.roleKeyword)}" placeholder="搜索角色名称"></div><button class="plain" data-action="role-query">查询</button><span class="toolbar-spacer"></span><button class="primary" data-action="role-new">＋ 新建角色</button></div>${list.length?`<div class="table-wrap"><table class="table role-table"><colgroup><col style="width:185px"><col style="width:110px"><col><col style="width:165px"><col style="width:135px"></colgroup><thead><tr><th>角色名称</th><th>用户数量</th><th>页面权限</th><th><button class="sort" data-action="role-time-sort">最近更新时间 ${state.roleSort==='desc'?'↓':'↑'}</button></th><th>操作</th></tr></thead><tbody>${list.map(r=>`<tr><td><strong>${esc(r.name)}</strong></td><td>${r.userCount} 个用户</td><td>${roleScopeLines(r.permissions).length?`<div class="role-perms">${roleScopeLines(r.permissions).map(x=>`<div class="role-perm-line"><span class="role-perm-check">√</span><span class="role-perm-scope">${x.scope}</span>${x.detail?`<span class="role-perm-detail">（${x.detail}）</span>`:''}</div>`).join('')}</div>`:'<span class="muted-value">未开通任何页面</span>'}</td><td>${r.updated}</td><td><div class="ops"><button class="link" data-action="role-edit" data-id="${r.id}">编辑</button><button class="danger-link" data-action="role-delete" data-id="${r.id}" title="删除前需二次确认">删除</button></div></td></tr>`).join('')}</tbody></table></div>${pagerHtml('roles',totalRoles)}`:'<div class="empty">还没有角色，点击「新建角色」创建第一个</div>'}`}
const prototypeBaseRender=render;
render=function(){if(state.module==='experts'||state.module==='roles'){document.querySelector('.page').classList.remove('skill-edit-page');let isExpert=state.module==='experts';pageTitle.textContent=isExpert?'专家':'角色与权限';pageSubtitle.textContent=isExpert?'把多个市场技能归类整合成一个可交付单元，只引用市场技能，与 FDE 技能互不影响':'角色与页面绑定：勾中哪些页面，持该角色的用户就能进入哪些页面';document.querySelectorAll('[data-module]').forEach(n=>n.classList.toggle('active',n.dataset.module===state.module));moduleTabs.classList.add('module-hidden');isExpert?renderExperts():renderRoles();return}prototypeBaseRender()};
</script>
<script>
function openExpertEditor(mode,row){let isNew=mode==='new',d=isNew?{name:'',intro:'',avatar:'',roleDesc:'',skillIds:[]}:{...row,skillIds:[...row.skillIds]};state.editor={kind:'expert',mode,data:d};drawerTitle.textContent=isNew?'新建专家':'编辑专家';drawer.classList.remove('readonly');drawerBody.innerHTML=`<div class="expert-editor-note">专家由多个市场技能组成。技能保持引用关系，市场技能更新后专家会同步使用最新内容。</div><section class="section section-card"><h3 class="section-title">基本信息</h3><div class="form-grid"><div class="field" data-expert-field="name"><label class="label"><span class="required">*</span> 专家名</label><input class="input" data-form="name" value="${esc(d.name)}" placeholder="如 经营分析专家"><div class="error-text">请填写专家名</div></div><div class="field" data-expert-field="avatar"><label class="label">图标*</label><div class="icon-row compact-icon-row"><span class="icon-preview">${d.avatar||'-'}</span><button type="button" class="plain" data-action="expert-avatar-select">选择图标</button></div></div><div class="field full" data-expert-field="intro"><label class="label"><span class="required">*</span> 简介<span class="required">*</span></label><textarea class="textarea" data-form="intro" maxlength="2000" placeholder="一句话说明该专家能解决什么问题">${esc(d.intro)}</textarea><div class="error-text">请填写简介</div><div class="hint">最多 200 字，用于列表和客户端展示</div></div><div class="field full" data-expert-field="roleDesc"><label class="label"><span class="required">*</span> 职责描述<span class="required">*</span></label><textarea class="textarea" style="min-height:132px" data-form="roleDesc" maxlength="2000" placeholder="描述专家的职责、工作方式、边界和输出要求">${esc(d.roleDesc)}</textarea><div class="error-text">请填写职责描述</div><div class="hint">职责描述会作为专家处理任务时的行为约束，最多 2000 字</div></div></div></section><section class="section section-card" data-expert-field="skills"><h3 class="section-title">市场技能引用 <span class="section-sub">至少添加 1 个市场技能</span></h3><div class="expert-skills">${expertSkillCatalog.map(s=>`<label class="skill-check"><input type="checkbox" name="expertSkill" value="${s.id}" ${d.skillIds.includes(s.id)?'checked':''}><span><strong>${esc(s.name)}</strong><small>${esc(s.desc)}</small></span></label>`).join('')}</div><div class="error-text">请至少添加 1 个技能</div></section>${isNew?'':`<div class="page-time"><span>当前状态：${expertView(d).label}</span><span>最新版本：${d.version||'-'}</span><span>最近更新时间：${d.updated}</span></div>`}`;drawerFoot.innerHTML=`<button class="plain" data-action="close">取消</button>${isNew?'':`<button class="plain" data-action="expert-version" data-id="${d.id}">发布</button>`}<button class="primary" data-action="expert-save">${isNew?'创建专家':'保存'}</button>`;drawer.classList.remove('closing');drawerMask.classList.add('open')}
function validateExpert(){let d=state.editor.data,ok=true;drawerBody.querySelectorAll('[data-expert-field].invalid').forEach(x=>x.classList.remove('invalid'));for(let k of ['name','intro','roleDesc'])if(!String(d[k]||'').trim()){drawerBody.querySelector(`[data-expert-field="${k}"]`).classList.add('invalid');ok=false}if(!d.skillIds.length){drawerBody.querySelector('[data-expert-field="skills"]').classList.add('invalid');ok=false}if(!ok)toastMsg('请先补齐必填项');return ok}
function saveExpert(){if(state.editor?.kind!=='expert'||!validateExpert())return;let d=state.editor.data;if(state.editor.mode==='new'){expertRows.unshift({...d,id:Date.now(),status:'draft',pendingAction:null,version:'',updated:'2026-08-24 18:30'});toastMsg('专家已创建')}else{Object.assign(expertRows.find(x=>x.id===d.id),d,{updated:'2026-08-24 18:30'});toastMsg('专家配置已保存')}closeDrawer();render()}
function openExpertVersion(r){let v=expertView(r);if(r.pendingAction){modal('撤回审核申请',`「${r.name}」当前处于${v.label}。撤回后回到修改前状态。`,'撤回申请',()=>{r.pendingAction=null;delete r.pendingVersion;delete r.pendingReleaseNotes;toastMsg('审核申请已撤回');render()});return}if(!r.skillIds.length){toastMsg('至少引用 1 个市场技能才能发布');return}if(typeof openManager==='function'){openManager(r)}else{toastMsg('版本管理功能加载中，请稍后再试')}}
function openRoleEditor(mode,row){let isNew=mode==='new',d=isNew?{name:'',permissions:[]}:{...row,permissions:[...row.permissions]};state.editor={kind:'role',mode,data:d};drawerTitle.textContent=isNew?'新建角色':'编辑角色与权限';drawer.classList.remove('readonly');drawerBody.innerHTML=`<section class="section section-card"><h3 class="section-title">角色信息</h3><div class="field role-editor-name" data-role-field="name"><label class="label"><span class="required">*</span> 角色名称</label><input class="input" data-form="name" value="${esc(d.name)}" placeholder="如 内容运营"><div class="error-text">请填写角色名称</div><div class="hint">角色名称用于用户分配，系统标识自动生成</div></div></section><section class="section section-card" data-role-field="permissions"><h3 class="section-title">页面权限 <span class="section-sub">勾中哪些页面，持该角色的用户就能进入哪些页面</span></h3><div class="permission-tree">${permissionGroups.map((s,si)=>{let sp=s.groups.flatMap(g=>g.pages),sc=sp.every(x=>d.permissions.includes(x));let isUserScope=s.scope==='用户端';return `<article class="perm-scope${isUserScope?' user-scope-only':''}"><label class="perm-scope-head"><input type="checkbox" data-perm-scope="${si}" ${sc?'checked':''}><span>${s.scope}</span>${!isUserScope?`<span class="hint">${sp.filter(x=>d.permissions.includes(x)).length}/${sp.length}</span>`:''}</label><div class="perm-scope-body"${isUserScope?' style="display:none"':''}>${s.groups.map((g,gi)=>{let gc=g.pages.every(x=>d.permissions.includes(x));return `<div class="perm-group"><label class="perm-group-title"><input type="checkbox" data-perm-group="${si}:${gi}" ${gc?'checked':''}><span>${g.name}</span></label><div class="perm-pages">${g.pages.map(pg=>`<label class="perm-page"><input type="checkbox" name="rolePermission" value="${esc(pg)}" ${d.permissions.includes(pg)?'checked':''}><span>${esc(pg)}</span></label>`).join('')}</div></div>`}).join('')}</div></article>`}).join('')}</div><div class="error-text">请至少开通 1 个页面</div><div class="permission-summary" id="permissionSummary">已选择 ${d.permissions.length} 个页面</div></section>${isNew?'':`<div class="danger-hint">该角色当前绑定 ${d.userCount} 个用户。权限调整保存后将对这些用户生效。</div>`}`;drawerFoot.innerHTML=`<button class="plain" data-action="close">取消</button><button class="primary" data-action="role-save">${isNew?'创建角色':'保存'}</button>`;drawer.classList.remove('closing');drawerMask.classList.add('open')}
function syncRolePermissions(){if(state.editor?.kind!=='role')return;let checks=[...drawerBody.querySelectorAll('[name="rolePermission"]')];state.editor.data.permissions=checks.filter(x=>x.checked).map(x=>x.value);permissionSummary.textContent=`已选择 ${state.editor.data.permissions.length} 个页面`;drawerBody.querySelector('[data-role-field="permissions"]')?.classList.toggle('invalid',!state.editor.data.permissions.length);permissionGroups.forEach((s,si)=>{let scopePages=s.groups.flatMap(g=>g.pages),scopeBox=drawerBody.querySelector(`[data-perm-scope="${si}"]`);if(scopeBox){scopeBox.checked=scopePages.every(x=>state.editor.data.permissions.includes(x));scopeBox.indeterminate=!scopeBox.checked&&scopePages.some(x=>state.editor.data.permissions.includes(x))}s.groups.forEach((g,gi)=>{let box=drawerBody.querySelector(`[data-perm-group="${si}:${gi}"]`);if(box){box.checked=g.pages.every(x=>state.editor.data.permissions.includes(x));box.indeterminate=!box.checked&&g.pages.some(x=>state.editor.data.permissions.includes(x))}})})}
function saveRole(){if(state.editor?.kind!=='role')return;let d=state.editor.data;drawerBody.querySelectorAll('[data-role-field].invalid').forEach(x=>x.classList.remove('invalid'));let ok=true;if(!String(d.name||'').trim()){drawerBody.querySelector('[data-role-field="name"]').classList.add('invalid');ok=false}if(!d.permissions.length){drawerBody.querySelector('[data-role-field="permissions"]').classList.add('invalid');ok=false}if(!ok){toastMsg('请先补齐必填项');return}if(state.editor.mode==='new'){roleRows.unshift({...d,id:Date.now(),userCount:0,created:'2026-08-24 18:30',updated:'2026-08-24 18:30'});toastMsg('角色已创建')}else{Object.assign(roleRows.find(x=>x.id===d.id),d,{updated:'2026-08-24 18:30'});toastMsg('角色与权限已保存')}closeDrawer();render()}
const expertNav=[...document.querySelectorAll('.nav-item')].find(n=>n.querySelector('.nav-label')?.textContent==='专家');const roleNav=[...document.querySelectorAll('.nav-item')].find(n=>n.querySelector('.nav-label')?.textContent==='角色');if(expertNav){expertNav.dataset.module='experts';expertNav.onclick=()=>{state.module='experts';state.userMenu=null;state.skillEditing=null;render()}}if(roleNav){roleNav.dataset.module='roles';roleNav.onclick=()=>{state.module='roles';state.userMenu=null;state.skillEditing=null;render()}}
view.addEventListener('input',e=>{if(e.target.id==='expertSearch')state.expertKeyword=e.target.value;if(e.target.id==='roleSearch')state.roleKeyword=e.target.value});
view.addEventListener('keyup',e=>{if(e.key==='Enter'&&(e.target.id==='expertSearch'||e.target.id==='roleSearch'))render()});
view.addEventListener('change',e=>{if(e.target.id==='expertStatus'){state.expertStatus=e.target.value;render()}});
view.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,ex=expertRows.find(x=>x.id==b.dataset.id),rl=roleRows.find(x=>x.id==b.dataset.id);if(a==='expert-new')openExpertEditor('new');if(a==='expert-edit'&&ex&&!b.disabled)openExpertEditor('edit',ex);if(a==='expert-query'||a==='role-query')render();if(a==='expert-version'&&ex)openExpertVersion(ex);if(a==='expert-stop'&&ex)modal('停用专家',`停用「${ex.name}」需提交审核。审核通过前客户端仍可使用。`,'提交停用审核',()=>{ex.pendingAction='stop';ex.updated='2026-08-24 18:30';toastMsg('已提交停用审核');render()});if(a==='expert-delete'&&ex)modal('删除专家',`删除「${ex.name}」后会解除 ${ex.skillIds.length} 条市场技能引用，技能本体不受影响。确认删除？`,'删除',()=>{expertRows.splice(expertRows.indexOf(ex),1);toastMsg('专家已删除');render()});if(a==='role-new')openRoleEditor('new');if(a==='role-edit'&&rl)openRoleEditor('edit',rl);if(a==='role-delete'&&rl){if(rl.userCount){modal('无法删除角色',`角色「${rl.name}」仍绑定 ${rl.userCount} 个用户。请先在用户页完成角色改绑。`,'知道了',()=>{});return}modal('删除角色',`删除后角色「${rl.name}」及其页面权限将不可恢复。确认删除？`,'删除',()=>{roleRows.splice(roleRows.indexOf(rl),1);toastMsg('角色已删除');render()})}});
drawerBody.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='expert-avatar-select'&&state.editor?.kind==='expert'){let choices=['▤','⌕','◎','§','✦','◈'];let d=state.editor.data;let current=Math.max(0,choices.indexOf(d.avatar));let next=choices[(current+1)%choices.length];d.avatar=next;let preview=b.parentElement.querySelector('.icon-preview');if(preview)preview.textContent=next;}});
drawerBody.addEventListener('change',e=>{if(state.editor?.kind==='expert'&&e.target.name==='expertSkill'){state.editor.data.skillIds=[...drawerBody.querySelectorAll('[name="expertSkill"]:checked')].map(x=>Number(x.value));drawerBody.querySelector('[data-expert-field="skills"]')?.classList.toggle('invalid',!state.editor.data.skillIds.length)}if(state.editor?.kind==='role'&&e.target.name==='rolePermission')syncRolePermissions();if(state.editor?.kind==='role'&&e.target.dataset.permGroup){let [si,gi]=e.target.dataset.permGroup.split(':').map(Number);permissionGroups[si].groups[gi].pages.forEach(pg=>{let box=[...drawerBody.querySelectorAll('[name="rolePermission"]')].find(x=>x.value===pg);if(box)box.checked=e.target.checked});syncRolePermissions()}if(state.editor?.kind==='role'&&e.target.dataset.permScope){let si=Number(e.target.dataset.permScope);permissionGroups[si].groups.flatMap(g=>g.pages).forEach(pg=>{let box=[...drawerBody.querySelectorAll('[name="rolePermission"]')].find(x=>x.value===pg);if(box)box.checked=e.target.checked});syncRolePermissions()}});
drawerFoot.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='expert-save')saveExpert();if(a==='role-save')saveRole();if(a==='expert-version'){let ex=expertRows.find(x=>x.id==b.dataset.id);if(ex){if(state.editor&&state.editor.kind==='expert'&&state.editor.data){if(!validateExpert())return;let d=new Date(),pad=v=>String(v).padStart(2,'0'),now=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());Object.assign(ex,state.editor.data,{updated:now});toastMsg('编辑内容已自动保存')}drawerMask.classList.remove('open');drawer.classList.remove('closing');state.editor=null;openExpertVersion(ex)}}});
render();
</script>
<script>const prototypePreviewParams=new URLSearchParams(location.search),prototypePreviewModule=prototypePreviewParams.get("module");if(["experts","roles"].includes(prototypePreviewModule)){state.module=prototypePreviewModule;render();if(prototypePreviewParams.get("editor")==="1"){prototypePreviewModule==="experts"?openExpertEditor("edit",expertRows[0]):openRoleEditor("edit",roleRows[1])}}</script>

<div class="skill-version-mask" id="skillVersionMask" aria-hidden="true">
  <aside class="skill-version-drawer" role="dialog" aria-modal="true" aria-labelledby="skillVersionTitle">
    <header class="skill-version-head"><h2 id="skillVersionTitle">版本管理</h2><span id="skillVersionStatus"></span><button class="icon-btn" id="skillVersionClose" aria-label="关闭">×</button></header>
    <main class="skill-version-body" id="skillVersionBody"></main>

<script>
(function(){
  var mask=document.getElementById('skillVersionMask');
  var body=document.getElementById('skillVersionBody');
  var foot=document.getElementById('skillVersionFoot');
  var statusBox=document.getElementById('skillVersionStatus');
  var current=null;
  var bump='NONE';
  var notes='';
  var versionHistories={};

  function parseVersion(label){
    var m=/^v?(\d+)\.(\d+)\.(\d+)$/.exec(String(label||'').trim());
    return m?[Number(m[1]),Number(m[2]),Number(m[3])]:null;
  }
  function isFirstPublish(){return !parseVersion(current&&current.version)}
  function previewVersion(){
    if(isFirstPublish())return 'v1.0.0';
    var p=parseVersion(current.version);
    if(bump==='MAJOR')return 'v'+(p[0]+1)+'.0.0';
    if(bump==='MINOR')return 'v'+p[0]+'.'+(p[1]+1)+'.0';
    return 'v'+p[0]+'.'+p[1]+'.'+(p[2]+1);
  }
  function bumpHint(){
    return bump==='MAJOR'?'重大改动或不兼容变更':bump==='MINOR'?'新增功能或能力':'修复问题或小幅调整';
  }
  function displayStatus(){
    return current&&current.display==='审核中'?{label:'审核中',cls:'status-review'}:current&&current.display==='已发布'?{label:'已发布',cls:'status-live'}:{label:'未发布',cls:''};
  }
  function seededHistory(skill){
    if(versionHistories[skill.id])return versionHistories[skill.id];
    var p=parseVersion(skill.version),rows=[];
    if(p){
      rows.push({version:skill.version,status:'ACTIVE',size:'18.6 KB',publisher:'管理员',publishedAt:skill.updatedAt||skill.createdAt,notes:'当前线上版本'});
      var prev=p[2]>0?'v'+p[0]+'.'+p[1]+'.'+(p[2]-1):p[1]>0?'v'+p[0]+'.'+(p[1]-1)+'.0':'';
      if(prev)rows.push({version:prev,status:'DELISTED',size:'17.9 KB',publisher:'管理员',publishedAt:'2026-08-20 16:30',disabledAt:'2026-08-23 10:15',notes:'历史稳定版本'});
    }
    versionHistories[skill.id]=rows;
    return rows;
  }
  function historyHtml(){
    var rows=seededHistory(current);
    if(!rows.length)return '<div class="version-history-empty">暂无版本 · 发布后将在此生成不可变版本快照</div>';
    var activeCount=rows.filter(function(item){return item.status==='ACTIVE'}).length;
    return rows.map(function(r,index){
      var active=r.status==='ACTIVE',lastActive=active&&activeCount===1;
      return '<article class="version-history-row '+(active?'':'is-disabled')+'" data-version-index="'+index+'"><div class="version-history-main"><span class="version-history-ver">'+esc(r.version)+'</span><span class="status-neutral '+(active?'status-live':'')+'">'+(active?'已启用':'已禁用')+'</span><span class="version-history-spacer"></span><button class="'+(active?'warning-link':'link')+'" data-version-action="'+(active?'disable':'enable')+'" data-index="'+index+'" '+(lastActive?'disabled title="当前版本是该技能最后一个启用版本。如需停止对外提供，请先整体下架技能。"':'')+'>'+(active?'禁用':'启用')+'</button></div><div class="version-history-meta"><span>大小 '+r.size+'</span><span>发布人 '+esc(r.publisher)+'</span><span>发布于 '+esc(r.publishedAt)+'</span>'+(r.disabledAt?'<span>禁用于 '+esc(r.disabledAt)+'</span>':'')+'</div>'+(r.notes?'<div class="version-history-notes">升级说明：'+esc(r.notes)+'</div>':'')+'</article>';
    }).join('');
  }
  function publishHtml(){
    if(current.display==='审核中'){
      return '<div class="version-review"><p>审核中，已锁定不可修改。可撤回本次提交后继续编辑。</p><div class="version-review-actions"><button class="plain" data-version-action="withdraw">撤回提交</button></div></div>';
    }
    var gate=current.type==='PLATFORM'&&(!current.category||current.category==='未分类')?'该技能还未选择「技能分类」，按规则不可提交发布。请到技能编辑页选择分类并保存后再来发布。':'';
    var updateType=isFirstPublish()?'':'<div class="version-form-row"><span class="version-label">更新类型</span><div class="version-bumps"><button class="version-bump '+(bump==='NONE'?'active':'')+'" data-bump="NONE">修订更新</button><button class="version-bump '+(bump==='MINOR'?'active':'')+'" data-bump="MINOR">功能更新</button><button class="version-bump '+(bump==='MAJOR'?'active':'')+'" data-bump="MAJOR">重大更新</button></div></div>';
    return '<div class="version-publish">'+(gate?'<div class="version-gate">'+gate+'</div>':'')+updateType+'<div class="version-form-row"><span class="version-label">版本号</span><span class="version-number">'+previewVersion()+'</span><span class="version-hint">'+(isFirstPublish()?'首个版本':bumpHint())+'</span></div><div class="version-notes"><label class="version-label" for="skillReleaseNotes">升级说明 <em>*</em></label><div class="version-notes-control"><textarea class="textarea" id="skillReleaseNotes" maxlength="2000" placeholder="简述本次更新了什么，方便记录与追溯">'+esc(notes)+'</textarea><div class="version-notes-meta"><span class="version-error">'+(notes.trim()?'':'升级说明必填，简述本次更新项')+'</span><span class="version-count">'+notes.length+' / 2000</span></div></div></div></div>';
  }
  function renderVersionManager(){
    var st=displayStatus();
    statusBox.innerHTML='<span class="status-neutral '+st.cls+'">'+st.label+'</span>';
    body.innerHTML='<div class="version-object"><span class="version-object-key">技能名称：</span><span class="version-object-name">'+esc(current.name)+'</span></div><section class="version-section"><h3 class="version-section-head">发布新版本</h3>'+publishHtml()+'</section><section class="version-section"><h3 class="version-section-head">版本历史 <span class="version-section-sub">每次审核通过生成一版整包快照；禁用仅使客户端无法再下载该版本，已下载不受影响</span></h3><div class="version-history">'+historyHtml()+'</div></section>';
    var gate=current.type==='PLATFORM'&&(!current.category||current.category==='未分类');

<script id="skill-import-return-flow-behavior">
(function(){

    notice.setAttribute('role','status');

  state.skillCategory='';

<script id="skill-publish-readiness-lock">
(function(){
function text(value){return String(value==null?'':value).trim()}
function skillPublishReadiness(skill,fromEditor){
  var missing=[];
  var name=fromEditor&&document.getElementById('skillEditorName')?document.getElementById('skillEditorName').value:skill&&skill.name;
  var category=fromEditor&&document.getElementById('skillEditorCategory')?document.getElementById('skillEditorCategory').value:skill&&skill.category;
  var description=fromEditor&&document.getElementById('skillEditorDescription')?document.getElementById('skillEditorDescription').value:skill&&skill.description;
  var example=fromEditor&&document.getElementById('skillEditorExample')?document.getElementById('skillEditorExample').value:skill&&skill.exampleQuestion;
  var skillMd=fromEditor&&document.getElementById('skillDocumentContent')&&state.skillActiveFile==='SKILL.md'?document.getElementById('skillDocumentContent').value:skill&&skill.skillFiles&&skill.skillFiles['SKILL.md'];
  if(!text(name))missing.push('技能名称');
  if(!text(skill&&skill.type))missing.push('技能类型');
  if(!text(category))missing.push('技能分类');
  if(!(skill&&(skill.icon||skill.iconImage)))missing.push('图标');
  if(!text(description))missing.push('技能描述');
  if(!text(example))missing.push('示例问题');
  if(!text(skillMd))missing.push('SKILL.md');
  return {ready:missing.length===0,missing:missing};
}
window.skillPublishReadiness=skillPublishReadiness;
function disabledTitle(result){return '请先补齐必填项：'+result.missing.join('、')}
function decoratePublishHtml(html,skill){
  if(!skill||skill.display!=='未发布')return html;
  var result=skillPublishReadiness(skill,false);
  if(result.ready)return html;
  var box=document.createElement('div');box.innerHTML=html;
  var button=box.querySelector('[data-action="skill-version"]');
  if(button){button.disabled=true;button.classList.add('skill-publish-disabled');button.title=disabledTitle(result);button.removeAttribute('data-action')}
  return box.innerHTML;
}
var baseSkillActionsForReadiness=skillActions;
skillActions=function(skill){return decoratePublishHtml(baseSkillActionsForReadiness(skill),skill)};
function refreshEditorPublishState(){
  if(state.module!=='skills'||!state.skillEditing)return;
  var skill=skillRows.find(function(item){return item.id==state.skillEditing});
  var button=view.querySelector('.skill-editor-top [data-action="skill-version"],.skill-editor-top .skill-publish-disabled');
  if(!skill||!button||skill.display!=='未发布')return;
  var result=skillPublishReadiness(skill,true);
  button.disabled=!result.ready;
  button.classList.toggle('skill-publish-disabled',!result.ready);
  button.title=result.ready?'发布将提交审核，审核通过后生成版本快照并上线':disabledTitle(result);
  if(result.ready)button.dataset.action='skill-version';else button.removeAttribute('data-action');
}
var baseRenderSkillsForReadiness=renderSkills;
renderSkills=function(){state.skillImportResult=null;baseRenderSkillsForReadiness();view.querySelectorAll('.skill-import-flow-notice,.skill-import-badge').forEach(function(node){node.remove()});view.querySelectorAll('.skill-imported-row,.skill-import-next-action').forEach(function(node){node.classList.remove('skill-imported-row','skill-import-next-action')})};
var baseRenderSkillEditorForReadiness=renderSkillEditor;
renderSkillEditor=function(){baseRenderSkillEditorForReadiness();refreshEditorPublishState()};
var baseSaveSkillCreateForReadiness=saveSkillCreate;
saveSkillCreate=function(){
  var importing=state.skillCreateMode==='zip';
  var beforeIds=new Set(skillRows.map(function(item){return item.id}));
  var result=baseSaveSkillCreateForReadiness();
  if(result===false)return result;
  var created=skillRows.filter(function(item){return !beforeIds.has(item.id)});
  state.skillImportResult=null;
  if(importing){
    created.forEach(function(item){if(item.description==='由技能包导入，请点击编辑继续配置')item.description=''});
    state.skillEditing=null;
    render();
  }else if(created[0]){
    created[0].description='';
    created[0].exampleQuestion='';
    created[0].skillFiles={'SKILL.md':''};
    state.skillActiveFile='SKILL.md';
    state.skillEditing=created[0].id;
    state.skillReadonly=false;
    render();
  }
  return result;
};
view.addEventListener('input',function(e){if(e.target&&['skillEditorName','skillEditorDescription','skillEditorExample','skillDocumentContent'].includes(e.target.id))refreshEditorPublishState()});
view.addEventListener('change',function(e){if(e.target&&e.target.id==='skillEditorCategory')refreshEditorPublishState()});
view.addEventListener('click',function(e){
  var disabled=e.target.closest('.skill-publish-disabled');
  if(!disabled)return;
  e.preventDefault();e.stopImmediatePropagation();
  var skill=skillRows.find(function(item){return item.id==(disabled.dataset.id||state.skillEditing)});
  var result=skillPublishReadiness(skill,!!state.skillEditing);
  toastMsg(disabledTitle(result));
},true);
if(state.module==='skills')state.skillEditing?renderSkillEditor():renderSkills();
})();

})();

<script id="task-pane-redesign-module">
(function(){
  var taskDemo=[
    {name:'每周经营报告',instruction:'每周一汇总上周经营数据，分析异常并生成经营分析报告',note:'面向管理岗，每周一上午自动推送',cycle:'weekly',times:['09:00'],startDate:'',endDate:'',detail:'用「工单查询工具」拉取上周工单数据，结合经营指标库分析环比/同比变化，识别异常波动并说明原因，最后生成结构化经营分析报告。',tools:[{name:'工单查询工具',type:'MCP',status:'已验证'},{name:'经营数据分析',type:'技能',status:'已验证'}],skillRefs:[{platformSkillId:'ps1',name:'经营指标分析'}]},
    {name:'每日异常指标检查',instruction:'每天检查经营指标是否存在异常波动，如有异常及时预警',note:'面向经营分析岗，工作日执行',cycle:'daily',times:['18:00'],startDate:'',endDate:'',detail:'用「指标查询工具」拉取当日核心经营指标，对比近 7 日趋势基线，识别超出阈值波动的指标，生成异常简报并推送到经营群。',tools:[{name:'指标查询工具',type:'MCP',status:'已验证'}],skillRefs:[]}
  ];
  state.posTaskSelected=0;
  state.posTaskNewMode=false;
  state.posTaskDraft=null;

  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  function cycleLabel(c){return c==='daily'?'每天':c==='weekly'?'每周':c==='monthly'?'每月':c==='once'?'仅一次':''}

  function nextTimes(cycle,times){
    var now=new Date();
    var result=[];
    var t=times[0]||'09:00';
    var parts=t.split(':');
    var hh=Number(parts[0])||9;
    var mi=Number(parts[1])||0;
    for(var i=0;i<3;i++){
      var d=new Date(now);
      if(cycle==='daily'){
        var passed=now.getHours()*60+now.getMinutes()>hh*60+mi;
        d.setDate(d.getDate()+i+(passed?1:0));
      }
      else if(cycle==='weekly'){d.setDate(d.getDate()+((7-d.getDay()+1)%7||7)+i*7)}
      else if(cycle==='monthly'){d.setMonth(d.getMonth()+i+1);d.setDate(1)}
      else if(cycle==='once'){if(i>0)break}
      d.setHours(hh,mi,0,0);
      var yyyy=d.getFullYear();
      var mm=String(d.getMonth()+1).padStart(2,'0');
      var dd=String(d.getDate()).padStart(2,'0');
      var hStr=String(hh).padStart(2,'0');
      var mStr=String(mi).padStart(2,'0');
      result.push(yyyy+'-'+mm+'-'+dd+'T'+hStr+':'+mStr+':00+08:00');
    }
    return result;
  }

  function taskItemHtml(t,i,active){
    if(state.posTaskNewMode&&i===-1){
      return '<button class="pd2-task-item new-item active"><strong>新增中...</strong><small>填写右侧信息后创建</small></button>';
    }
    var cls='pd2-task-item'+(active?' active':'');
    var sub=cycleLabel(t.cycle)+' '+(t.times[0]||'09:00')+' \u00b7 '+(t.tools?t.tools.length:0)+' 个工具'+(t.skillRefs&&t.skillRefs.length?' \u00b7 引用 '+t.skillRefs.length+' 平台技能':'');
    var missingFlag=!String(t.instruction||'').trim()?'<span class="pd2-task-flag" title="还没填「一句话指令」，发布时会被拦下，请先补齐">缺指令</span>':'';
    return '<button class="'+cls+'" data-ptask="select" data-index="'+i+'" draggable="true"><span class="pd2-task-drag" title="拖动排序">\u2802</span><div class="pd2-task-main"><div class="pd2-task-name">'+esc(t.name)+missingFlag+'</div><small>'+esc(sub)+'</small></div></button>';
  }

  function tasksPane(ro){
    var listHtml='';
    if(state.posTaskNewMode){
      listHtml+=taskItemHtml(null,-1,true);
    }
    taskDemo.forEach(function(t,i){
      var active=!state.posTaskNewMode&&state.posTaskSelected===i;
      listHtml+=taskItemHtml(t,i,active);
    });

    var detailHtml='';
    if(state.posTaskNewMode||state.posTaskSelected>=0){
      var t=state.posTaskNewMode?(state.posTaskDraft||{name:'',instruction:'',note:'',cycle:'daily',times:['09:00'],startDate:'',endDate:'',detail:'',tools:[]}):(taskDemo[state.posTaskSelected]||taskDemo[0]);
      detailHtml=taskFormHtml(t,ro,state.posTaskNewMode);
    }else{
      detailHtml='<div class="pd2-task-empty-detail"><div><strong>暂无任务</strong>点击左侧"新增样例任务"创建</div></div>';
    }

    return '<div class="pd2-task-layout"><aside class="pd2-task-list"><div class="pd2-list-head"><strong>自动化任务</strong><span class="spacer"></span>'+(ro?'':'<button class="link" data-ptask="add">新增</button>')+'</div><div class="pd2-task-list-body">'+listHtml+'</div>'+(ro?'':'<button class="pd2-task-add" data-ptask="add-sample">+ 新增样例任务</button>')+'</aside><main class="pd2-task-detail"><div class="pd2-task-detail-inner">'+detailHtml+'</div></main></div>';
  }

  function taskFormHtml(t,ro,isNew){
    var roAttr=ro?'disabled':'';
    var nameLen=(t.name||'').length;
    var instLen=(t.instruction||'').length;
    var noteLen=(t.note||'').length;
    var detailLen=(t.detail||'').length;

    var timesHtml=t.times.map(function(tm,i){
      return '<div class="pd2-task-time-row"><span class="pd2-task-time-prefix">'+(i+1)+'</span><div class="pd2-task-time-input"><span class="pd2-task-time-icon">\u23F0</span><input type="time" value="'+esc(tm)+'" data-ptask-field="time" data-index="'+i+'" '+roAttr+'></div>'+(ro||t.times.length<=1?'':'<button class="pd2-task-time-remove" data-ptask="remove-time" data-index="'+i+'" type="button">\u00D7</button>')+'</div>';
    }).join('');

    var addTimeHtml=(ro||isNew?'':'<button class="pd2-task-add-time" data-ptask="add-time" type="button">+添加时间</button>');

    var cycleRadios=[{val:'daily',label:'每天'},{val:'weekly',label:'每周'},{val:'monthly',label:'每月'},{val:'once',label:'仅一次'}];

    var cycleHtml=cycleRadios.map(function(r,idx){
      return '<span class="pd2-task-radio"><input type="radio" name="taskCycle" value="'+r.val+'" '+(t.cycle===r.val?'checked':'')+' '+(ro?'disabled':'')+' data-ptask-field="cycle"><label>'+r.label+'</label></span>';
    }).join('');

    var previewTimes=nextTimes(t.cycle,t.times);
    var previewHtml='<div class="pd2-task-preview"><div class="pd2-task-preview-sched">'+esc(cycleLabel(t.cycle)+' '+(t.times[0]||'09:00'))+'</div><div class="pd2-task-preview-next"><span class="pd2-task-preview-next-label">接下来 3 次：</span>'+previewTimes.map(function(ts){return '<span class="pd2-task-preview-pill">'+esc(ts)+'</span>'}).join('')+'</div></div>';

    var toolsHtml='';
    if(t.tools&&t.tools.length){
      toolsHtml=t.tools.map(function(tool){
        return '<div class="pd2-task-tool-row"><strong>'+esc(tool.name)+'</strong><small>'+esc(tool.type)+'</small><span class="tag '+(tool.status==='已验证'?'green':'gray')+'">'+esc(tool.status)+'</span></div>';
      }).join('');
    }else{
      toolsHtml='<div class="pd2-task-empty" style="padding:16px">暂未引用工具</div>';
    }

    var isNewLabel=isNew?'创建样例':'保存修改';
    var deleteBtn=isNew||ro?'':'<button class="danger-link" data-ptask="delete" type="button" style="margin-left:auto">删除</button>';

    return '<div class="pd2-task-section"><div class="pd2-task-section-head"><strong>基本信息</strong>'+deleteBtn+'</div><div class="pd2-task-section-body"><div class="pd2-task-field"><div class="pd2-task-field-label">任务名称 <em>*</em><span class="pd2-task-field-counter">'+nameLen+' / 60</span></div><input class="input" maxlength="60" value="'+esc(t.name)+'" placeholder="给样例起个名字，如「每日工单汇总」" data-ptask-field="name" '+roAttr+'></div><div class="pd2-task-field"><div class="pd2-task-field-label">一句话指令 <em>*</em><span class="pd2-task-field-counter">'+instLen+' / 2000</span></div><textarea class="textarea" maxlength="2000" placeholder="到点让搭子做什么，自包含大白话，可含 [SILENT] 降噪（无实质变化只输出不打扰）" data-ptask-field="instruction" '+roAttr+'>'+esc(t.instruction)+'</textarea><div class="pd2-task-field-hint">启用样例必填：这句话就是到点触发搭子办事的指令。</div></div><div class="pd2-task-field"><div class="pd2-task-field-label">说明（备注）<span class="pd2-task-field-counter">'+noteLen+' / 200</span></div><textarea class="textarea" maxlength="200" placeholder="这条样例帮领用者做什么、适合谁用（可不填）" data-ptask-field="note" '+roAttr+'>'+esc(t.note)+'</textarea></div></div></div><div class="pd2-task-section"><div class="pd2-task-section-head"><strong>调度计划</strong></div><div class="pd2-task-section-body"><div class="pd2-task-field"><div class="pd2-task-field-label">周期类型</div><div class="pd2-task-radio-row">'+cycleHtml+'</div></div><div class="pd2-task-field"><div class="pd2-task-field-label">定点时间</div>'+timesHtml+addTimeHtml+'<div class="pd2-task-field-hint">支持一天多个定点（如 09:00 / 11:00 / 13:00），同日自动去重。</div></div><div class="pd2-task-field"><div class="pd2-task-field-label">起止日期</div><div class="pd2-task-date-row"><div class="pd2-task-date-input"><input type="date" value="'+esc(t.startDate)+'" placeholder="从哪天开始（不填=立即）" data-ptask-field="startDate" '+roAttr+'></div><span class="pd2-task-date-sep">至</span><div class="pd2-task-date-input"><input type="date" value="'+esc(t.endDate)+'" placeholder="到哪天结束（不填=一直有效）" data-ptask-field="endDate" '+roAttr+'></div></div></div></div></div>'+previewHtml+'<div class="pd2-task-section"><div class="pd2-task-section-head"><strong>详细说明</strong> <em style="color:#d93026;font-style:normal">*</em></div><div class="pd2-task-section-body"><div class="pd2-task-editor-toolbar"><button class="pd2-task-editor-tool" data-ptask-fmt="bold" type="button" title="加粗"><b>B</b></button><button class="pd2-task-editor-tool" data-ptask-fmt="italic" type="button" title="斜体"><i>I</i></button><button class="pd2-task-editor-tool" data-ptask-fmt="strikeThrough" type="button" title="删除线"><s>S</s></button><span class="pd2-task-editor-divider"></span><button class="pd2-task-editor-tool" data-ptask-fmt="formatBlock" data-val="H2" type="button" title="标题">H</button><button class="pd2-task-editor-tool" data-ptask-fmt="formatBlock" data-val="BLOCKQUOTE" type="button" title="引用">\u201C</button><button class="pd2-task-editor-tool" data-ptask-fmt="insertUnorderedList" type="button" title="无序列表">\u2261</button><button class="pd2-task-editor-tool" data-ptask-fmt="insertOrderedList" type="button" title="有序列表">\u2261</button><span class="pd2-task-editor-divider"></span><button class="pd2-task-editor-tool" data-ptask-fmt="insertHTML" data-val="table" type="button" title="表格">&lt;&gt;</button><button class="pd2-task-editor-tool" data-ptask-fmt="insertImage" type="button" title="图片">\u221E</button><button class="pd2-task-editor-tool" data-ptask-fmt="createLink" type="button" title="链接">\u229E</button><span class="pd2-task-editor-divider"></span><button class="pd2-task-editor-tool" data-ptask-fmt="undo" type="button" title="撤销">\u21B6</button><button class="pd2-task-editor-tool" data-ptask-fmt="redo" type="button" title="重做">\u21B7</button></div><div class="pd2-task-editor" contenteditable="'+(ro?'false':'true')+'" data-ptask-editor data-placeholder="用自然语言写清这件事要怎么办：目标是什么、分哪几步、用到哪些工具、产出什么结果。">'+esc(t.detail)+'</div><div class="pd2-task-editor-foot"><div class="pd2-task-editor-hint">例如：每天上班前，用「工单查询工具」拉取昨日工单，汇总成今日待办清单。</div><div class="pd2-task-editor-counter">字数: '+detailLen+'</div></div></div></div><div class="pd2-task-section"><div class="pd2-task-section-head"><strong>引用工具</strong></div><div class="pd2-task-section-body"><div class="pd2-task-tools-list">'+toolsHtml+'</div>'+(ro?'':'<button class="pd2-task-tool-add" data-ptask="add-tool" type="button">+ 添加工具</button>')+'</div></div><div class="pd2-task-section"><div class="pd2-task-section-head"><strong>引用平台技能</strong></div><div class="pd2-task-section-body"><p class="pd2-task-field-hint" style="margin:0 0 10px">引用<b>平台技能</b>（由系统配置员发布），让这条样例复用现成能力；你自建的 FDE 技能不在此列。</p>'+(t.skillRefs&&t.skillRefs.length?'<div class="pd2-task-skill-chips">'+t.skillRefs.map(function(s){return '<span class="pd2-task-skill-chip"><span>'+esc(s.name||('技能 #'+s.platformSkillId))+'</span>'+(ro?'':'<button type="button" class="pd2-task-skill-x" data-ptask="remove-skill" data-sid="'+esc(s.platformSkillId)+'" title="移除">\u00d7</button>')+'</span>'}).join('')+'</div>':'')+(ro?'':'<div class="pd2-task-skill-search"><input class="input" placeholder="搜索平台技能名 / 描述" data-ptask-field="skillKeyword"></div><div class="pd2-task-skill-list"><div class="pd2-task-skill-empty">输入关键词搜索可引用的平台技能</div></div>')+'</div></div><div class="pd2-task-foot"><span class="spacer"></span>'+(ro?'':'<button class="plain" data-ptask="cancel" type="button">取消</button>')+(ro?'':'<button class="primary" data-ptask="save" type="button">'+isNewLabel+'</button>')+'</div>';
  }

  var oldRenderPosPane=renderPosPane;
  renderPosPane=function(r,ro){
    if(state.positionDetailTab==='tasks')return tasksPane(ro);
    return oldRenderPosPane(r,ro);
  };

  var P=window.positionDetailProto2;
  function rerender(){
    if(typeof renderPositionDetail==='function'){renderPositionDetail()}
    else if(P&&typeof P.render==='function'){P.render()}
  }

  view.addEventListener('click',function(e){
    if(!state.positionDetailId||state.positionDetailTab!=='tasks')return;
    var b=e.target.closest('[data-ptask]');
    if(!b)return;
    var a=b.dataset.ptask;
    e.preventDefault();
    e.stopImmediatePropagation();

    if(a==='add'||a==='add-sample'){
      state.posTaskNewMode=true;
      state.posTaskSelected=-1;
      state.posTaskDraft={name:'',instruction:'',note:'',cycle:'daily',times:['09:00'],startDate:'',endDate:'',detail:'',tools:[],skillRefs:[]};
      rerender();
      return;
    }
    if(a==='select'){
      state.posTaskSelected=Number(b.dataset.index);
      state.posTaskNewMode=false;
      state.posTaskDraft=null;
      rerender();
      return;
    }
    if(a==='cancel'){
      state.posTaskNewMode=false;
      state.posTaskSelected=0;
      state.posTaskDraft=null;
      rerender();
      return;
    }
    if(a==='save'){
      var detail=view.querySelector('[data-ptask-editor]');
      var detailText=detail?detail.innerText.trim():'';
      var nameInput=view.querySelector('[data-ptask-field="name"]');
      var instInput=view.querySelector('[data-ptask-field="instruction"]');
      if(!nameInput||!nameInput.value.trim()){toastMsg('请填写任务名称');nameInput.focus();return}
      if(!instInput||!instInput.value.trim()){toastMsg('请填写一句话指令');instInput.focus();return}
      if(!detailText){toastMsg('请填写详细说明');detail.focus();return}
      var cycleEl=view.querySelector('input[name="taskCycle"]:checked');
      var cycle=cycleEl?cycleEl.value:'daily';
      var times=[].slice.call(view.querySelectorAll('[data-ptask-field="time"]')).map(function(el){return el.value});
      var startDate=view.querySelector('[data-ptask-field="startDate"]');
      var endDate=view.querySelector('[data-ptask-field="endDate"]');
      var noteInput=view.querySelector('[data-ptask-field="note"]');
      var skillRefs=state.posTaskNewMode?[]:(taskDemo[state.posTaskSelected]&&taskDemo[state.posTaskSelected].skillRefs||[]);var taskData={name:nameInput.value.trim(),instruction:instInput.value.trim(),note:noteInput?noteInput.value.trim():'',cycle:cycle,times:times,startDate:startDate?startDate.value:'',endDate:endDate?endDate.value:'',detail:detailText,tools:state.posTaskNewMode?[]:(taskDemo[state.posTaskSelected]&&taskDemo[state.posTaskSelected].tools||[]),skillRefs:skillRefs};
      if(state.posTaskNewMode){
        taskDemo.push(taskData);
        state.posTaskNewMode=false;
        state.posTaskDraft=null;
        state.posTaskSelected=taskDemo.length-1;
        toastMsg('样例任务已创建');
      }else{
        taskDemo[state.posTaskSelected]=taskData;
        toastMsg('修改已保存');
      }
      if(P&&P.markDirty)P.markDirty();
      rerender();
      return;
    }
    if(a==='add-time'){
      var cur=state.posTaskNewMode?state.posTaskDraft:(taskDemo[state.posTaskSelected]||{times:[]});
      if(!cur.times)cur.times=['09:00'];
      cur.times.push('09:00');
      if(!state.posTaskNewMode)taskDemo[state.posTaskSelected].times=cur.times;
      rerender();
      return;
    }
    if(a==='remove-time'){
      var idx=Number(b.dataset.index);
      if(state.posTaskNewMode){
        if(state.posTaskDraft&&state.posTaskDraft.times){
          state.posTaskDraft.times.splice(idx,1);
          if(!state.posTaskDraft.times.length)state.posTaskDraft.times=['09:00'];
        }
      }else{
        if(taskDemo[state.posTaskSelected]&&taskDemo[state.posTaskSelected].times){
          taskDemo[state.posTaskSelected].times.splice(idx,1);
          if(!taskDemo[state.posTaskSelected].times.length)taskDemo[state.posTaskSelected].times=['09:00'];
        }
      }
      rerender();
      return;

    if(a==='add-tool'){
      toastMsg('请从已配置的 Agent 与技能中选择');
      return;
    }

    var f=e.target.dataset.ptaskField;

    var counter=e.target.closest('.pd2-task-field')&&e.target.closest('.pd2-task-field').querySelector('.pd2-task-field-counter');
    if(counter){
      var max=e.target.getAttribute('maxlength');
      counter.textContent=(e.target.value||'').length+' / '+(max||'');
    }
    if(f==='cycle'||f==='time'||f==='startDate'||f==='endDate'){
      var t=state.posTaskNewMode?state.posTaskDraft:(!state.posTaskNewMode&&state.posTaskSelected>=0?taskDemo[state.posTaskSelected]:null);

        if(f==='cycle'){t.cycle=e.target.value}
        if(f==='time'){t.times[Number(e.target.dataset.index)]=e.target.value}
        if(f==='startDate'){t.startDate=e.target.value}
        if(f==='endDate'){t.endDate=e.target.value}
        var preview=view.querySelector('.pd2-task-preview');
        if(preview){
          var schedLabel=preview.querySelector('.pd2-task-preview-sched');
          var timesArr=t.times.length?t.times:['09:00'];
          if(schedLabel)schedLabel.textContent=cycleLabel(t.cycle)+' '+(timesArr[0]||'09:00');
          var nextCont=preview.querySelector('.pd2-task-preview-next');
          if(nextCont){
            var pills=nextTimes(t.cycle,timesArr).map(function(ts){return '<span class="pd2-task-preview-pill">'+esc(ts)+'</span>'}).join('');
            nextCont.innerHTML='<span class="pd2-task-preview-next-label">接下来 3 次：</span>'+pills;
          }
        }
      }
    }
    if(e.target.matches('[data-ptask-editor]')){
      var ec=e.target.closest('.pd2-task-section-body');
      if(ec){
        var counter2=ec.querySelector('.pd2-task-editor-counter');
        if(counter2)counter2.textContent='字数: '+(e.target.innerText.trim().length);
      }
      if(P&&P.markDirty)P.markDirty();
    }
  });

  view.addEventListener('change',function(e){
    if(!state.positionDetailId||state.positionDetailTab!=='tasks')return;
    if(e.target.name==='taskCycle'){
      if(P&&P.markDirty)P.markDirty();
      var t=state.posTaskNewMode?state.posTaskDraft:(!state.posTaskNewMode&&state.posTaskSelected>=0?taskDemo[state.posTaskSelected]:null);
      if(t){t.cycle=e.target.value}
      if(t){
        var preview=view.querySelector('.pd2-task-preview');
        if(preview){
          var schedLabel=preview.querySelector('.pd2-task-preview-sched');
          if(schedLabel)schedLabel.textContent=cycleLabel(t.cycle)+' '+((t.times&&t.times[0])||'09:00');
          var nextCont=preview.querySelector('.pd2-task-preview-next');
          if(nextCont){
            var timesArr=(t.times&&t.times.length)?t.times:['09:00'];
            var pills=nextTimes(t.cycle,timesArr).map(function(ts){return '<span class="pd2-task-preview-pill">'+esc(ts)+'</span>'}).join('');
            nextCont.innerHTML='<span class="pd2-task-preview-next-label">接下来 3 次：</span>'+pills;
          }
        }
      }
    }
  });

  view.addEventListener('click',function(e){
    if(!state.positionDetailId||state.positionDetailTab!=='tasks')return;
    var b=e.target.closest('[data-ptask-fmt]');
    if(!b)return;
    e.preventDefault();
    e.stopImmediatePropagation();
    var fmt=b.dataset.ptaskFmt;
    var val=b.dataset.val;
    var ed=view.querySelector('[data-ptask-editor]');
    if(!ed)return;
    ed.focus();
    if(fmt==='insertHTML'&&val==='table'){
      document.execCommand('insertHTML',false,'<table><tbody><tr><th>项目</th><th>说明</th></tr><tr><td>内容</td><td>内容</td></tr></tbody></table><p><br></p>');
    }else if(fmt==='formatBlock'){
      document.execCommand('formatBlock',false,val);
    }else if(fmt==='insertImage'){
      var url=window.prompt('图片地址');
      if(url)document.execCommand('insertImage',false,url);
    }else if(fmt==='createLink'){
      var link=window.prompt('链接地址');
      if(link)document.execCommand('createLink',false,link);
    }else{
      document.execCommand(fmt,false,null);
    }
    if(P&&P.markDirty)P.markDirty();
    var counter=ed.closest('.pd2-task-section-body');
    if(counter){
      var cc=counter.querySelector('.pd2-task-editor-counter');
      if(cc)cc.textContent='字数: '+(ed.innerText.trim().length);
    }
  },true);

  // Delete task handler (override existing delete-task)
  document.addEventListener('click',function(e){
    if(!state.positionDetailId||state.positionDetailTab!=='tasks')return;
    var b=e.target.closest('[data-ptask="delete"]');
    if(!b)return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if(state.posTaskSelected>=0&&taskDemo[state.posTaskSelected]){
      var name=taskDemo[state.posTaskSelected].name;
      taskDemo.splice(state.posTaskSelected,1);
      state.posTaskSelected=taskDemo.length>0?0:-1;
      toastMsg('任务「'+name+'」已删除');
      if(P&&P.markDirty)P.markDirty();
      rerender();
    }
  },true);
})();

<script id="workprofile-basic-info-alignment-script">

function alignWorkProfile(){
  if(!state.positionDetailId||state.positionDetailTab!=='workProfile')return;
  var host=view.querySelector('.pd2-content');
  var section=host&&host.querySelector('.wp3-sec');
  if(!section)return;
  var head=section.querySelector('.wp3-head');
  var body=section.querySelector('.wp3-body');
  if(!head||!body||head.dataset.basicInfoAligned==='1')return;

  var side=host.querySelector('.wp3-side');
  var editable=!!(window.positionDetailProto2&&!state.positionDetailReadonly&&!window.positionDetailProto2.currentPos().pendingAction);
  var nameInput=head.querySelector('[data-wp3-policy="name"]');
  var descInput=head.querySelector('[data-wp3-policy="desc"]');
  var readonlyName=head.querySelector('strong');
  var readonlyDesc=head.querySelector('span:not(.spacer)');
  var fields=document.createElement('div');
  fields.className='wp3-basic-fields';

  function field(label,node,value){
    var wrap=document.createElement('div');
    wrap.className='wp3-field';
    var lab=document.createElement('label');
    lab.textContent=label;
    wrap.appendChild(lab);
    if(node){
      node.removeAttribute('style');
      wrap.appendChild(node);
    }else{
      var read=document.createElement('div');
      read.className='readonly-value';
      read.textContent=value||'-';
      wrap.appendChild(read);
    }
    fields.appendChild(wrap);
  }

  if(editable){
    field('档案名称',nameInput,'');
    field('档案说明',descInput,'');
  }else{
    field('档案名称',null,readonlyName&&readonlyName.textContent);
    field('档案说明',null,readonlyDesc&&readonlyDesc.textContent);
  }

  head.innerHTML='<strong>基本信息</strong><span class="spacer"></span>';
  if(editable){
    var actions=document.createElement('div');
    actions.className='wp3-head-actions';
    actions.innerHTML='<button class="plain" data-sync-cancel="1" type="button">取消</button><button class="primary" data-wp3-action="save" type="button">保存</button>';
    head.appendChild(actions);
  }
  body.insertBefore(fields,body.firstChild);
  head.dataset.basicInfoAligned='1';
}

var queued=false;
function queueAlign(){
  if(queued)return;
  queued=true;
  requestAnimationFrame(function(){queued=false;alignWorkProfile()});
}
new MutationObserver(queueAlign).observe(view,{childList:true,subtree:true});
queueAlign();
})();

<script id="agent-task-feedback-refinement-script">
(function(){
function textOf(el){return el?el.textContent.trim():''}
function enhanceAgent(host){
  var pane=host.querySelector('[data-sync-agent]');
  if(!pane||pane.dataset.cardRefined==='1')return;
  var oldHead=pane.querySelector('.sync-agent-head');
  var table=pane.querySelector('.sync-table');
  if(!oldHead||!table)return;
  var card=document.createElement('section');
  card.className='sync-agent-card';
  oldHead.className='pd2-task-section-head sync-agent-card-head';
  var body=document.createElement('div');
  body.className='sync-agent-card-body';
  body.appendChild(table);
  card.appendChild(oldHead);
  card.appendChild(body);
  pane.appendChild(card);
  pane.dataset.cardRefined='1';
}
function enhanceTaskList(pane){
  pane.querySelectorAll('.pd2-task-list .pd2-task-item').forEach(function(item,index){
    var name=item.querySelector('.pd2-task-name');
    var ops=item.querySelector('.sync-task-ops');
    if(!name||!ops)return;
    var edit=ops.querySelector('.link');
    var remove=ops.querySelector('.danger-link');
    if(edit)edit.remove();
    if(remove){
      remove.dataset.staticTaskDelete=String(index);
      remove.textContent='删除';
      name.appendChild(remove);
    }
    ops.remove();
  });
}
function enhanceSchedule(pane){
  var scheduleSections=Array.from(pane.querySelectorAll('.pd2-task-section')).filter(function(sec){
    return textOf(sec.querySelector('.pd2-task-section-head strong'))==='调度计划';
  });
  if(!scheduleSections.length)return;
  var section=scheduleSections[0];
  if(section.dataset.scheduleRefined==='1')return;
  var fields=section.querySelectorAll('.pd2-task-field');
  var cycleField=Array.from(fields).find(function(field){return textOf(field.querySelector('.pd2-task-field-label'))==='周期类型'});
  if(cycleField){
    cycleField.innerHTML='<div class="pd2-task-schedule-row"><span class="pd2-task-schedule-label">周期类型</span><div class="pd2-task-segmented" role="group" aria-label="周期类型"><button type="button" data-static-cycle="daily">每天</button><button type="button" class="on" data-static-cycle="weekly">每周</button><button type="button" data-static-cycle="monthly">每月</button><button type="button" data-static-cycle="once">仅一次</button></div></div><div class="pd2-task-schedule-row" data-static-week-row><span class="pd2-task-schedule-label">执行星期</span><div class="pd2-task-weekdays" role="group" aria-label="执行星期">'+['周一','周二','周三','周四','周五','周六','周日'].map(function(day,i){return '<button type="button" class="'+(i===0?'on':'')+'" data-static-weekday="'+i+'">'+day+'</button>'}).join('')+'</div></div>';
  }
  var dateRow=section.querySelector('.pd2-task-date-row');
  if(dateRow){
    Array.from(dateRow.querySelectorAll('input')).forEach(function(input,index){
      if(input.closest('.pd2-calendar-field'))return;
      input.type='text';
      input.readOnly=true;
      input.classList.add('input');
      input.placeholder=index===0?'从哪天开始（不填=立即）':'到哪天结束（不填=一直有效）';
      input.dataset.staticDate=index===0?'start':'end';
      var wrap=document.createElement('div');
      wrap.className='pd2-calendar-field';
      input.parentNode.insertBefore(wrap,input);
      wrap.appendChild(input);
    });
  }
  section.dataset.scheduleRefined='1';
}
function enhanceTools(pane){
  var section=Array.from(pane.querySelectorAll('.pd2-task-section')).find(function(sec){
    return textOf(sec.querySelector('.pd2-task-section-head strong'))==='引用工具';
  });
  if(!section||section.dataset.searchRefined==='1')return;
  var body=section.querySelector('.pd2-task-section-body');
  var list=body&&body.querySelector('.pd2-task-tools-list');
  var firstTool=body&&body.querySelector('.pd2-task-tool-row');
  var anchor=list||firstTool;
  if(!body||!anchor)return;
  var search=document.createElement('div');
  search.className='pd2-task-tool-search';
  search.innerHTML='<input class="input" type="search" data-static-tool-search placeholder="搜索工具名称 / 类型">';
  body.insertBefore(search,anchor);
  section.dataset.searchRefined='1';
}
function enhanceSkills(pane){
  var section=Array.from(pane.querySelectorAll('.pd2-task-section')).find(function(sec){
    return textOf(sec.querySelector('.pd2-task-section-head strong'))==='引用平台技能';
  });
  if(!section||section.dataset.addRefined==='1')return;
  var body=section.querySelector('.pd2-task-section-body');
  var input=body&&body.querySelector('input');
  if(!body||!input)return;
  body.querySelectorAll('.pd2-task-skill-list,.pd2-task-skill-empty').forEach(function(node){node.remove()});
  var selected=document.createElement('div');
  selected.className='pd2-task-added-skills';
  selected.dataset.staticAddedSkills='1';
  var row=document.createElement('div');
  row.className='pd2-task-skill-action-row skill-search-only';
  input.parentNode.insertBefore(selected,input);
  input.parentNode.insertBefore(row,input);
  row.appendChild(input);
  input.placeholder='搜索平台技能名 / 描述';
  var add=document.createElement('button');
  add.type='button';
  add.className='pd2-task-tool-add pd2-task-skill-bottom-add';
  add.dataset.staticSkillAdd='1';
  add.textContent='+ 添加技能';
  body.appendChild(add);
  section.dataset.addRefined='1';
}
function enhanceTaskFooter(pane){
  pane.querySelectorAll('.pd2-task-foot').forEach(function(foot){
    var cancel=foot.querySelector('.plain');
    if(cancel)cancel.remove();
    var save=foot.querySelector('.primary');
    if(save){save.textContent='保存';save.dataset.staticTaskSave='1'}
  });
}
function enhanceTasks(host){
  var pane=host.querySelector('[data-sync-task]');
  if(!pane||pane.dataset.feedbackRefined==='1')return;
  enhanceTaskList(pane);
  var firstHeadDelete=pane.querySelector('.pd2-task-detail .pd2-task-section:first-child .pd2-task-section-head .danger-link');
  if(firstHeadDelete)firstHeadDelete.remove();
  enhanceSchedule(pane);
  enhanceTools(pane);
  enhanceSkills(pane);
  enhanceTaskFooter(pane);
  pane.dataset.feedbackRefined='1';
}
function enhance(){
  if(!state.positionDetailId)return;
  var host=view.querySelector('.pd2-content');
  if(!host)return;
  if(state.positionDetailTab==='agents')enhanceAgent(host);
  if(state.positionDetailTab==='tasks')enhanceTasks(host);
}
var queued=false;
function queueEnhance(){
  if(queued)return;
  queued=true;
  requestAnimationFrame(function(){queued=false;enhance()});
}
new MutationObserver(queueEnhance).observe(view,{childList:true,subtree:true});
function closeCalendars(except){
  view.querySelectorAll('.pd2-calendar-popover.open').forEach(function(pop){if(pop!==except)pop.classList.remove('open')});
}
function isoDate(year,month,day){
  return year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
}
function renderCalendar(pop,input){
  var year=Number(pop.dataset.year);
  var month=Number(pop.dataset.month);
  var first=new Date(year,month,1);
  var start=new Date(year,month,1-first.getDay());
  var current=input.value;
  var today=new Date();
  var cells='';
  for(var i=0;i<42;i++){
    var d=new Date(start);
    d.setDate(start.getDate()+i);
    var value=isoDate(d.getFullYear(),d.getMonth(),d.getDate());
    var classes=[];
    if(d.getMonth()!==month)classes.push('muted');
    if(value===isoDate(today.getFullYear(),today.getMonth(),today.getDate()))classes.push('today');
    if(value===current)classes.push('selected');
    cells+='<button type="button" class="'+classes.join(' ')+'" data-static-date-value="'+value+'">'+d.getDate()+'</button>';
  }
  pop.innerHTML='<div class="pd2-calendar-head"><button type="button" data-static-cal-nav="-12">«</button><button type="button" data-static-cal-nav="-1">‹</button><strong>'+year+' 年 '+(month+1)+' 月</strong><button type="button" data-static-cal-nav="1">›</button><button type="button" data-static-cal-nav="12">»</button></div><div class="pd2-calendar-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="pd2-calendar-grid">'+cells+'</div>';
}
function openCalendar(input){
  var wrap=input.closest('.pd2-calendar-field');
  var pop=wrap.querySelector('.pd2-calendar-popover');
  if(!pop){
    pop=document.createElement('div');
    pop.className='pd2-calendar-popover';
    var parsed=input.value?new Date(input.value+'T00:00:00'):new Date();
    pop.dataset.year=String(parsed.getFullYear());
    pop.dataset.month=String(parsed.getMonth());
    wrap.appendChild(pop);
  }
  renderCalendar(pop,input);
  var opening=!pop.classList.contains('open');
  closeCalendars(pop);
  pop.classList.toggle('open',opening);
}
view.addEventListener('click',function(e){
  if(!state.positionDetailId)return;
  var del=e.target.closest('[data-static-task-delete]');
  if(del){
    e.preventDefault();
    e.stopPropagation();
    var item=del.closest('.pd2-task-item');
    if(item)item.remove();
    if(typeof toastMsg==='function')toastMsg('任务已删除');
    return;
  }
  var cycle=e.target.closest('[data-static-cycle]');
  if(cycle){
    var group=cycle.closest('.pd2-task-segmented');
    group.querySelectorAll('button').forEach(function(btn){btn.classList.toggle('on',btn===cycle)});
    var row=cycle.closest('.pd2-task-section').querySelector('[data-static-week-row]');
    if(row)row.style.display=cycle.dataset.staticCycle==='weekly'?'grid':'none';
    var preview=cycle.closest('.pd2-task-detail-inner').querySelector('.pd2-task-preview-sched');
    if(preview)preview.textContent=cycle.textContent.trim()+' 09:00';
    return;
  }
  var weekday=e.target.closest('[data-static-weekday]');
  if(weekday){weekday.classList.toggle('on');return}
  var dateInput=e.target.closest('[data-static-date]');
  if(dateInput){e.preventDefault();openCalendar(dateInput);return}
  var nav=e.target.closest('[data-static-cal-nav]');
  if(nav){
    var pop=nav.closest('.pd2-calendar-popover');
    var month=Number(pop.dataset.month)+Number(nav.dataset.staticCalNav);
    var date=new Date(Number(pop.dataset.year),month,1);
    pop.dataset.year=String(date.getFullYear());
    pop.dataset.month=String(date.getMonth());
    renderCalendar(pop,pop.closest('.pd2-calendar-field').querySelector('[data-static-date]'));
    return;
  }
  var day=e.target.closest('[data-static-date-value]');
  if(day){
    var pop=day.closest('.pd2-calendar-popover');
    var input=pop.closest('.pd2-calendar-field').querySelector('[data-static-date]');
    input.value=day.dataset.staticDateValue;
    pop.classList.remove('open');
    return;
  }
  var addSkill=e.target.closest('[data-static-skill-add]');
  if(addSkill){
    var section=addSkill.closest('.pd2-task-section-body');
    var input=section.querySelector('input');
    var name=input.value.trim();
    if(!name){if(typeof toastMsg==='function')toastMsg('请输入要添加的平台技能');input.focus();return}
    var selected=section.querySelector('[data-static-added-skills]');
    if(Array.from(selected.querySelectorAll('.pd2-task-added-skill span')).some(function(x){return x.textContent===name})){if(typeof toastMsg==='function')toastMsg('该技能已添加');return}
    selected.insertAdjacentHTML('beforeend','<span class="pd2-task-added-skill"><span>'+name.replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})+'</span><button type="button" data-static-skill-remove aria-label="移除技能">×</button></span>');
    input.value='';
    var empty=section.querySelector('.pd2-task-skill-empty');
    if(empty)empty.style.display='none';
    if(typeof toastMsg==='function')toastMsg('平台技能已添加');
    return;
  }
  var removeSkill=e.target.closest('[data-static-skill-remove]');
  if(removeSkill){removeSkill.closest('.pd2-task-added-skill').remove();return}
  var save=e.target.closest('[data-static-task-save]');
  if(save){if(typeof toastMsg==='function')toastMsg('任务已保存');return}
  if(!e.target.closest('.pd2-calendar-field'))closeCalendars();
},true);
view.addEventListener('input',function(e){
  if(!e.target.matches('[data-static-tool-search]'))return;
  var keyword=e.target.value.trim().toLowerCase();
  var section=e.target.closest('.pd2-task-section-body');
  section.querySelectorAll('.pd2-task-tool-row').forEach(function(row){row.style.display=textOf(row).toLowerCase().indexOf(keyword)>=0?'':'none'});
});
queueEnhance();
})();

<script id="knowledge-source-api-auth-refinement-script">
(function(){
var sourceStatusValue='';
function escapeHtml(value){
  return String(value==null?'':value).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});
}
function removeKnowledgeStopButtons(){
  var kbMask=document.querySelector('#kb2Mask');
  if(!kbMask||!kbMask.classList.contains('open'))return;
  kbMask.querySelectorAll('[data-kb-action="stop-kb"]').forEach(function(button){button.remove()});
}
function applySourceStatusFilter(){
  var root=document.querySelector('#kb2Content');
  var select=root&&root.querySelector('#source2Status');
  var table=root&&root.querySelector('.kb2-table');
  if(!select||!table)return;
  var visible=0;
  table.querySelectorAll('tbody tr').forEach(function(row){
    var cells=row.querySelectorAll('td');
    var status=cells[3]?cells[3].textContent.trim():'';
    var show=!sourceStatusValue||status===sourceStatusValue;
    row.style.display=show?'':'none';
    if(show)visible++;
  });
  var pager=root.querySelector('.pager span');
  if(pager)pager.textContent='共 '+visible+' 条';
}
function enhanceSourceStatus(){
  var root=document.querySelector('#kb2Content');
  var type=root&&root.querySelector('#source2Type');
  if(!type)return;
  var select=root.querySelector('#source2Status');
  if(!select){
    select=document.createElement('select');
    select.className='select';
    select.id='source2Status';
    select.innerHTML='<option value="">全部状态</option><option value="启用">启用</option><option value="停用">停用</option>';
    type.insertAdjacentElement('afterend',select);
  }
  select.value=sourceStatusValue;
  applySourceStatusFilter();
}
function ensureAuthData(d){
  if(!d.authType)d.authType='NONE';
  if(d.authType==='BEARER')d.authType='BEARER_TOKEN';
  if(!Array.isArray(d.authParams))d.authParams=[];
  if(d.authType==='API_KEY'&&!d.authParams.length){
    d.authParams.push({name:d.authName||'X-Api-Key',description:'选填：这个参数是做什么的',clientFill:false,position:(d.authIn||'HEADER')==='QUERY'?'Query':'Header',defaultValue:''});
  }
}
function authParamRows(d,ro){
  return d.authParams.map(function(param,index){
    return '<div class="api-auth-grid api-auth-grid-row" data-api-auth-row="'+index+'"><input class="input" data-auth-input="name" data-auth-index="'+index+'" value="'+escapeHtml(param.name||'')+'" placeholder="参数名" '+(ro?'disabled':'')+'><input class="input" data-auth-input="description" data-auth-index="'+index+'" value="'+escapeHtml(param.description||'')+'" placeholder="描述（客户端可见）" '+(ro?'disabled':'')+'><label class="api-auth-client"><input type="checkbox" data-auth-input="clientFill" data-auth-index="'+index+'" '+(param.clientFill?'checked':'')+' '+(ro?'disabled':'')+'></label><select class="select" data-auth-input="position" data-auth-index="'+index+'" '+(ro?'disabled':'')+'><option value="Query" '+(param.position==='Query'?'selected':'')+'>Query</option><option value="Body" '+(param.position==='Body'?'selected':'')+'>Body</option><option value="Header" '+(param.position==='Header'?'selected':'')+'>Header</option><option value="Path" '+(param.position==='Path'?'selected':'')+'>Path</option></select><input class="input" data-auth-input="defaultValue" data-auth-index="'+index+'" value="'+escapeHtml(param.defaultValue||'')+'" placeholder="'+(param.clientFill?'由客户端填写':'参数值')+'" '+(param.clientFill||ro?'disabled':'')+'>'+(!ro?'<button type="button" class="api-auth-delete" data-auth-delete data-auth-index="'+index+'">删除</button>':'<span></span>')+'</div>';
  }).join('');
}
function authContent(d,ro){
  var radios='<div class="api-auth-type-label">鉴权类型</div><div class="api-auth-type-row"><label><input type="radio" name="apiAuthType" value="NONE" '+(d.authType==='NONE'?'checked':'')+' '+(ro?'disabled':'')+'>不鉴权</label><label><input type="radio" name="apiAuthType" value="API_KEY" '+(d.authType==='API_KEY'?'checked':'')+' '+(ro?'disabled':'')+'>API KEY</label><label><input type="radio" name="apiAuthType" value="BEARER_TOKEN" '+(d.authType==='BEARER_TOKEN'?'checked':'')+' '+(ro?'disabled':'')+'>Bearer Token</label></div>';
  if(d.authType==='API_KEY'){
    return radios+'<div class="api-auth-params-title">鉴权参数</div><div class="api-auth-table">'+(d.authParams.length?'<div class="api-auth-grid api-auth-grid-head"><span>参数名</span><span>描述（客户端可见）</span><span>客户端填写</span><span>位置</span><span>参数值</span><span></span></div>'+authParamRows(d,ro):'<div class="api-schema-empty">暂无鉴权参数</div>')+'</div>'+(!ro?'<div class="api-auth-add-row"><button type="button" class="link" data-auth-add>＋ 添加参数</button><span class="api-auth-add-note">客户端填写参数由客户端收集，平台不存值</span></div>':'');
  }
  if(d.authType==='BEARER_TOKEN'){
    return radios+'<label class="api-auth-bearer-label"><span class="required">*</span> Token <span class="api-auth-bearer-hint">只填 Token 本体；加密存储，不回显明文</span></label><div class="api-auth-bearer-row"><span class="api-auth-bearer-prefix">Authorization: Bearer</span><input class="input" type="password" data-api-bearer-token value="'+escapeHtml(d.bearerToken||'')+'" placeholder="请输入 Token" '+(ro?'disabled':'')+'></div>';
  }
  return radios;
}
function enhanceApiAuth(){
  if(!window.state||!state.editor||state.editor.kind!=='api')return;
  var d=state.editor.data;
  var ro=!!state.editor.readonly;
  ensureAuthData(d);
  Array.from(drawerBody.querySelectorAll('.section-card')).forEach(function(section){
    if(section.classList.contains('api-schema-section'))return;
    var title=section.querySelector('.section-title');
    if(title&&title.textContent.trim().indexOf('鉴权')===0)section.remove();
  });
  var block=drawerBody.querySelector('.api-schema-section .auth-block');
  if(!block||block.dataset.authRefined==='1')return;
  block.className='api-schema-block auth-block api-auth-refined';
  block.innerHTML='<div class="api-auth-title-row"><strong>鉴权配置</strong><span>凭证会静态附加到每次请求</span></div>'+authContent(d,ro);
  block.dataset.authRefined='1';
}
function enhanceAll(){
  removeKnowledgeStopButtons();
  enhanceSourceStatus();
  enhanceApiAuth();
}
var queued=false;
function queueEnhance(){
  if(queued)return;
  queued=true;
  requestAnimationFrame(function(){queued=false;enhanceAll()});
}
new MutationObserver(queueEnhance).observe(document.body,{childList:true,subtree:true});
document.addEventListener('change',function(e){
  if(e.target.id==='source2Status'){
    sourceStatusValue=e.target.value;
    applySourceStatusFilter();
    return;
  }
  if(e.target.name==='apiAuthType'&&state.editor&&state.editor.kind==='api'){
    state.editor.data.authType=e.target.value;
    if(typeof renderApiEditor==='function')renderApiEditor();
    return;
  }
},true);
document.addEventListener('input',function(e){
  if(e.target.matches('[data-api-bearer-token]')&&state.editor&&state.editor.kind==='api'){
    state.editor.data.bearerToken=e.target.value;
  }
  if(e.target.matches('[data-auth-input="name"][data-auth-index="0"]')&&state.editor&&state.editor.kind==='api'){
    state.editor.data.authName=e.target.value;
  }
},true);
queueEnhance();
})();
