<script id="task-calendar-preview-editor-refinement-script">
(function(){
var calendarLayer=null;
var calendarInput=null;
var editorSample='<h3># 每日经营晨报</h3><ol><li>拉取昨日营收 / 毛利 / 回款数据</li><li>与近 7 日均值对比，标注异常指标</li><li>生成三段式晨报：总览 / 异常 / 建议动作</li></ol>';
function two(value){return String(value).padStart(2,'0')}
function dateValue(year,month,day){return year+'-'+two(month+1)+'-'+two(day)}
function parseDate(value){
  var match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value||'');
  return match?new Date(Number(match[1]),Number(match[2])-1,Number(match[3])):new Date();
}
function closeTaskCalendar(){
  if(calendarLayer){calendarLayer.remove();calendarLayer=null}
  if(calendarInput){calendarInput.setAttribute('aria-expanded','false');calendarInput=null}
}
function renderTaskCalendar(){
  if(!calendarLayer||!calendarInput)return;
  var year=Number(calendarLayer.dataset.year);
  var month=Number(calendarLayer.dataset.month);
  var first=new Date(year,month,1);
  var start=new Date(year,month,1-first.getDay());
  var selected=calendarInput.value;
  var today=new Date();
  var cells='';
  for(var index=0;index<42;index++){
    var current=new Date(start);
    current.setDate(start.getDate()+index);
    var value=dateValue(current.getFullYear(),current.getMonth(),current.getDate());
    var classes=[];
    if(current.getMonth()!==month)classes.push('muted');
    if(value===dateValue(today.getFullYear(),today.getMonth(),today.getDate()))classes.push('today');
    if(value===selected)classes.push('selected');
    cells+='<button type="button" class="'+classes.join(' ')+'" data-task-date-value="'+value+'" aria-label="'+value+'">'+current.getDate()+'</button>';
  }
  calendarLayer.innerHTML='<div class="task-calendar-head"><button type="button" data-task-calendar-nav="-12" aria-label="上一年">«</button><button type="button" data-task-calendar-nav="-1" aria-label="上个月">‹</button><strong>'+year+' 年 '+(month+1)+' 月</strong><button type="button" data-task-calendar-nav="1" aria-label="下个月">›</button><button type="button" data-task-calendar-nav="12" aria-label="下一年">»</button></div><div class="task-calendar-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="task-calendar-grid">'+cells+'</div>';
}
function positionTaskCalendar(){
  if(!calendarLayer||!calendarInput)return;
  var rect=calendarInput.getBoundingClientRect();
  var width=calendarLayer.offsetWidth||386;
  var height=calendarLayer.offsetHeight||410;
  var left=Math.min(Math.max(12,rect.left),window.innerWidth-width-12);
  var below=rect.bottom+8;
  var top=below+height<=window.innerHeight-12?below:Math.max(12,rect.top-height-8);
  calendarLayer.style.left=left+'px';
  calendarLayer.style.top=top+'px';
}
function openTaskCalendar(input){
  closeTaskCalendar();
  calendarInput=input;
  calendarInput.setAttribute('aria-expanded','true');
  var initial=parseDate(input.value);
  calendarLayer=document.createElement('div');
  calendarLayer.className='task-date-calendar-layer';
  calendarLayer.dataset.year=String(initial.getFullYear());
  calendarLayer.dataset.month=String(initial.getMonth());
  calendarLayer.setAttribute('role','dialog');
  calendarLayer.setAttribute('aria-label','选择日期');
  document.body.appendChild(calendarLayer);
  renderTaskCalendar();
  positionTaskCalendar();
}
function normalizePreview(pane){
  pane.querySelectorAll('.pd2-task-preview').forEach(function(preview){
    preview.querySelectorAll('.pd2-task-preview-pill').forEach(function(pill){
      if(/T\d{2}:\d{2}/.test(pill.textContent))pill.textContent=pill.textContent.replace(/T(\d{2}:\d{2})(?::\d{2})?(?:[+-]\d{2}:\d{2}|Z)?$/,' $1');
    });
  });
}
function editorSection(pane){
  return Array.from(pane.querySelectorAll('.pd2-task-section')).find(function(section){
    var title=section.querySelector('.pd2-task-section-head strong');
    return title&&title.textContent.trim()==='详细说明';
  });
}
function updateEditorCount(editor){
  var section=editor.closest('.pd2-task-section');
  var counter=section&&section.querySelector('.pd2-task-editor-counter');
  if(counter)counter.textContent='字数: '+editor.innerText.replace(/\s+/g,' ').trim().length;
}
function toolbarHtml(){
  return '<button class="pd2-task-editor-tool" type="button" data-task-editor-command="bold" title="加粗"><b>B</b></button><button class="pd2-task-editor-tool" type="button" data-task-editor-command="italic" title="斜体"><i>I</i></button><button class="pd2-task-editor-tool" type="button" data-task-editor-command="strikeThrough" title="删除线"><s>S</s></button><span class="pd2-task-editor-divider"></span><button class="pd2-task-editor-tool" type="button" data-task-editor-command="formatBlock" data-task-editor-value="H3" title="标题">H</button><button class="pd2-task-editor-tool" type="button" data-task-editor-command="formatBlock" data-task-editor-value="BLOCKQUOTE" title="引用">❞</button><button class="pd2-task-editor-tool" type="button" data-task-editor-command="insertUnorderedList" title="无序列表">☷</button><button class="pd2-task-editor-tool" type="button" data-task-editor-command="insertOrderedList" title="有序列表">1.</button><span class="pd2-task-editor-divider"></span><button class="pd2-task-editor-tool" type="button" data-task-editor-command="formatBlock" data-task-editor-value="PRE" title="代码">&lt;&gt;</button><button class="pd2-task-editor-tool" type="button" data-task-editor-command="insertText" data-task-editor-value="code" title="行内代码">▣</button><button class="pd2-task-editor-tool" type="button" data-task-editor-command="createLink" title="链接">↗</button><button class="pd2-task-editor-tool" type="button" data-task-editor-command="insertTable" title="表格">▦</button><span class="pd2-task-editor-divider"></span><button class="pd2-task-editor-tool" type="button" data-task-editor-command="undo" title="撤销">↶</button><button class="pd2-task-editor-tool" type="button" data-task-editor-command="redo" title="重做">↷</button>';
}
function enhanceEditor(pane){
  var section=editorSection(pane);
  if(!section)return;
  var body=section.querySelector('.pd2-task-section-body');
  var toolbar=body&&body.querySelector('.pd2-task-editor-toolbar');
  var editor=body&&body.querySelector('.pd2-task-editor');
  var foot=body&&body.querySelector('.pd2-task-editor-foot');
  if(!body||!toolbar||!editor||!foot)return;
  if(!body.querySelector('.pd2-task-editor-guide')){
    var guide=document.createElement('div');
    guide.className='pd2-task-editor-guide';
    guide.textContent='用自然语言写清这件事要怎么办：目标是什么、分哪几步、用到哪些工具、产出什么结果。';
    body.insertBefore(guide,toolbar);
  }
  if(toolbar.dataset.taskRefined!=='1'){
    toolbar.innerHTML=toolbarHtml();
    toolbar.dataset.taskRefined='1';
  }
  editor.dataset.taskRichEditor='1';
  var plain=editor.innerText.replace(/\s+/g,' ').trim();
  if(!editor.dataset.sampleRefined&&(plain.indexOf('汇总上周经营数据')===0||plain==='')){
    editor.innerHTML=editorSample;
    editor.dataset.sampleRefined='1';
  }
  Array.from(foot.children).forEach(function(child){
    if(!child.classList.contains('pd2-task-editor-counter'))child.remove();
  });
  if(!foot.querySelector('.pd2-task-editor-counter')){
    var counter=document.createElement('div');
    counter.className='pd2-task-editor-counter';
    foot.appendChild(counter);
  }
  updateEditorCount(editor);
}
function enhanceTaskPane(){
  var pane=document.querySelector('.pd2-pane[data-sync-task]');
  if(!pane)return;
  normalizePreview(pane);
  enhanceEditor(pane);
}
function runEditorCommand(button){
  var pane=button.closest('.pd2-pane[data-sync-task]');
  var editor=pane&&pane.querySelector('[data-task-rich-editor]');
  if(!editor)return;
  editor.focus();
  var command=button.dataset.taskEditorCommand;
  var value=button.dataset.taskEditorValue||null;
  if(command==='createLink'){
    var url=window.prompt('请输入链接地址');
    if(!url)return;
    document.execCommand('createLink',false,url);
  }else if(command==='insertTable'){
    document.execCommand('insertHTML',false,'<table><tbody><tr><td>字段</td><td>内容</td></tr><tr><td><br></td><td><br></td></tr></tbody></table><p><br></p>');
  }else if(command==='insertText'&&value==='code'){
    var selection=window.getSelection();
    var content=selection&&selection.toString()?selection.toString():'代码';
    document.execCommand('insertHTML',false,'<code>'+content.replace(/[&<>]/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]})+'</code>');
  }else{
    document.execCommand(command,false,value);
  }
  updateEditorCount(editor);
}
document.addEventListener('click',function(event){
  var input=event.target.closest('[data-static-date]');
  if(input){
    event.preventDefault();
    event.stopImmediatePropagation();
    openTaskCalendar(input);
    return;
  }
  var nav=event.target.closest('[data-task-calendar-nav]');
  if(nav&&calendarLayer){
    event.preventDefault();
    var offset=Number(nav.dataset.taskCalendarNav);
    var next=new Date(Number(calendarLayer.dataset.year),Number(calendarLayer.dataset.month)+offset,1);
    calendarLayer.dataset.year=String(next.getFullYear());
    calendarLayer.dataset.month=String(next.getMonth());
    renderTaskCalendar();
    positionTaskCalendar();
    return;
  }
  var day=event.target.closest('[data-task-date-value]');
  if(day&&calendarInput){
    event.preventDefault();
    calendarInput.value=day.dataset.taskDateValue;
    calendarInput.dispatchEvent(new Event('input',{bubbles:true}));
    calendarInput.dispatchEvent(new Event('change',{bubbles:true}));
    closeTaskCalendar();
    return;
  }
  var editorButton=event.target.closest('[data-task-editor-command]');
  if(editorButton){
    event.preventDefault();
    runEditorCommand(editorButton);
    return;
  }
  if(calendarLayer&&!event.target.closest('.task-date-calendar-layer'))closeTaskCalendar();
},true);
document.addEventListener('input',function(event){
  if(event.target.matches('[data-task-rich-editor]'))updateEditorCount(event.target);
},true);
window.addEventListener('resize',closeTaskCalendar);
document.addEventListener('scroll',function(event){
  if(calendarLayer&&event.target!==calendarLayer&&event.target!==document)closeTaskCalendar();
},true);
var queued=false;
function queueEnhance(){
  if(queued)return;
  queued=true;
  requestAnimationFrame(function(){queued=false;enhanceTaskPane()});
}
new MutationObserver(queueEnhance).observe(document.body,{childList:true,subtree:true});
queueEnhance();
})();

<script id="followup-skill-kb-auth-refinement-script">
(function(){
function htmlEscape(value){
  return String(value==null?'':value).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});
}
function placeSkillAdd(){

  if(!pane)return;
  var section=Array.from(pane.querySelectorAll('.pd2-task-section')).find(function(item){
    var title=item.querySelector('.pd2-task-section-head strong');
    return title&&title.textContent.trim()==='引用平台技能';
  });
  if(!section)return;
  var body=section.querySelector('.pd2-task-section-body');
  var button=body&&body.querySelector('[data-static-skill-add]');
  var row=body&&body.querySelector('.pd2-task-skill-action-row');
  if(!body||!button||button.dataset.bottomPlaced==='1')return;

  button.className='pd2-task-tool-add pd2-task-skill-bottom-add';
  button.textContent='+ 添加技能';
  button.dataset.bottomPlaced='1';
  body.appendChild(button);
}
function enhancePositionKnowledgeActions(){}
function jumpToKnowledge(button){
  var id=button.dataset.kbId;
  state.positionDetailId=null;
  state.positionDetailDirty=false;
  state.module='knowledge';
  state.knowledgeTab='kb';
  state.kbKeyword='';
  state.kbType='';
  state.kbStatus='';
  render();
  requestAnimationFrame(function(){
    var action=button.dataset.jumpKb==='view'?'view-kb':'edit-kb';
    var target=document.querySelector('[data-kb-action="'+action+'"][data-id="'+id+'"]');
    if(target)target.click();
  });
}
function ensureAuthData(data){
  if(!data.authType)data.authType='NONE';
  if(data.authType==='BEARER')data.authType='BEARER_TOKEN';
  if(!Array.isArray(data.authParams))data.authParams=[];
  if(data.authType==='API_KEY'&&!data.authParams.length){
    data.authParams.push({
      name:data.authName||'X-Api-Key',
      description:'选填：这个参数是做什么的',
      clientFill:false,
      position:(data.authIn||'HEADER')==='QUERY'?'Query':'Header',
      defaultValue:''
    });
  }
}
function authParamRows(data,readonly){
  return data.authParams.map(function(param,index){
    return '<div class="api-auth-grid api-auth-grid-row" data-api-auth-row="'+index+'"><input class="input" data-auth-input="name" data-auth-index="'+index+'" value="'+htmlEscape(param.name||'')+'" placeholder="参数名" '+(readonly?'disabled':'')+'><input class="input" data-auth-input="description" data-auth-index="'+index+'" value="'+htmlEscape(param.description||'')+'" placeholder="描述（客户端可见）" '+(readonly?'disabled':'')+'><label class="api-auth-client"><input type="checkbox" data-auth-input="clientFill" data-auth-index="'+index+'" '+(param.clientFill?'checked':'')+' '+(readonly?'disabled':'')+'></label><select class="select" data-auth-input="position" data-auth-index="'+index+'" '+(readonly?'disabled':'')+'><option value="Query" '+(param.position==='Query'?'selected':'')+'>Query</option><option value="Body" '+(param.position==='Body'?'selected':'')+'>Body</option><option value="Header" '+(param.position==='Header'?'selected':'')+'>Header</option><option value="Path" '+(param.position==='Path'?'selected':'')+'>Path</option></select><input class="input" data-auth-input="defaultValue" data-auth-index="'+index+'" type="'+(param.clientFill?'text':'password')+'" value="'+htmlEscape(param.defaultValue||'')+'" placeholder="'+(param.clientFill?'由客户端填写':'请输入参数值')+'" '+(param.clientFill||readonly?'disabled':'')+'>'+(!readonly?'<button type="button" class="api-auth-delete" data-auth-delete data-auth-index="'+index+'">删除</button>':'<span></span>')+'</div>';
  }).join('');
}
function authMasterContent(data,readonly){
  var disabled=readonly?'disabled':'';
  var radios='<div class="api-auth-type-label">鉴权类型</div><div class="api-auth-type-row"><label><input type="radio" name="apiAuthType" value="NONE" '+(data.authType==='NONE'?'checked':'')+' '+disabled+'>不鉴权</label><label><input type="radio" name="apiAuthType" value="API_KEY" '+(data.authType==='API_KEY'?'checked':'')+' '+disabled+'>API KEY</label><label><input type="radio" name="apiAuthType" value="BEARER_TOKEN" '+(data.authType==='BEARER_TOKEN'?'checked':'')+' '+disabled+'>Bearer Token</label></div>';
  if(data.authType==='API_KEY'){
    return radios+'<div class="api-auth-params-title">鉴权参数</div><div class="api-auth-table">'+(data.authParams.length?'<div class="api-auth-grid api-auth-grid-head"><span>参数名</span><span>描述（客户端可见）</span><span>客户端填写</span><span>位置</span><span>参数值</span><span></span></div>'+authParamRows(data,readonly):'<div class="api-schema-empty">暂无鉴权参数</div>')+'</div>'+(!readonly?'<div class="api-auth-add-row"><button type="button" class="link" data-auth-add>＋ 添加参数</button><span class="api-auth-add-note">客户端填写参数由客户端收集，平台不存值</span></div>':'');
  }
  if(data.authType==='BEARER_TOKEN'){
    return radios+'<label class="api-auth-bearer-label"><span class="required">*</span> Token <span class="api-auth-bearer-hint">只填 Token 本体；加密存储，不回显明文</span></label><div class="api-auth-bearer-row"><span class="api-auth-bearer-prefix">Authorization: Bearer</span><input class="input" type="password" data-api-bearer-token value="'+htmlEscape(data.bearerToken||'')+'" placeholder="请输入 Token" '+disabled+'></div>';
  }
  return radios;
}
function rebuildAuthMaster(){
  if(!state.editor||state.editor.kind!=='api')return;
  var authDrawerBody=document.querySelector('#drawerBody');
  if(!authDrawerBody)return;
  var data=state.editor.data;
  var readonly=!!state.editor.readonly;
  ensureAuthData(data);
  Array.from(authDrawerBody.querySelectorAll('.section-card')).forEach(function(section){
    if(section.classList.contains('api-auth-master'))return;
    var title=section.querySelector('.section-title');
    if(title&&title.textContent.trim().indexOf('鉴权')===0)section.remove();
  });
  authDrawerBody.querySelectorAll('.api-schema-section .auth-block').forEach(function(block){block.remove()});
  var requestSection=Array.from(authDrawerBody.querySelectorAll('.section-card')).find(function(section){
    var title=section.querySelector('.section-title');
    return title&&title.textContent.trim()==='请求配置';
  });
  if(!requestSection)return;
  var master=authDrawerBody.querySelector('.api-auth-master');
  if(!master){
    master=document.createElement('section');
    master.className='section section-card api-auth-master';
    master.innerHTML='<h3 class="section-title"><span class="api-auth-master-title" aria-label="鉴权配置"></span><span class="section-sub">凭证会静态附加到每次请求</span></h3><div class="api-auth-refined">'+authMasterContent(data,readonly)+'</div>';
    requestSection.insertAdjacentElement('afterend',master);

window.applyApiAuthMaster=rebuildAuthMaster;
function refreshAuthMaster(){

function enhanceAll(){

var queued=false;

  requestAnimationFrame(function(){queued=false;enhanceAll()});
}
document.addEventListener('click',function(event){
  var apiOpen=event.target.closest('[data-action="api-new"],[data-action="api-view"],[data-action="api-edit"]');
  if(apiOpen)setTimeout(rebuildAuthMaster,0);
  var jump=event.target.closest('[data-jump-kb]');

    jumpToKnowledge(jump);

  }
  var add=event.target.closest('.api-auth-master [data-auth-add]');
  if(add&&state.editor&&state.editor.kind==='api'){
    event.preventDefault();
    state.editor.data.authParams.push({name:'',description:'',clientFill:false,position:'Header',defaultValue:''});
    refreshAuthMaster();
    return;
  }
  var remove=event.target.closest('.api-auth-master [data-auth-delete]');
  if(remove&&state.editor&&state.editor.kind==='api'){
    event.preventDefault();

document.addEventListener('input',function(event){
  var field=event.target.closest('.api-auth-master [data-auth-input]');
  if(!field||!state.editor||state.editor.kind!=='api')return;
  var param=state.editor.data.authParams[Number(field.dataset.authIndex)];
  if(!param)return;
  param[field.dataset.authInput]=field.type==='checkbox'?field.checked:field.value;
  if(field.dataset.authInput==='name'&&Number(field.dataset.authIndex)===0)state.editor.data.authName=field.value;
},true);
document.addEventListener('change',function(event){
  if(event.target.name==='apiAuthType')setTimeout(rebuildAuthMaster,0);

  if(!field||!state.editor||state.editor.kind!=='api')return;
  var param=state.editor.data.authParams[Number(field.dataset.authIndex)];
  if(!param)return;
  param[field.dataset.authInput]=field.type==='checkbox'?field.checked:field.value;
  if(field.dataset.authInput==='clientFill')refreshAuthMaster();
},true);
new MutationObserver(queueEnhance).observe(document.body,{childList:true,subtree:true});
queueEnhance();
})();

<script id="expert-background-color-behavior">

<script id="connector-browser-comment-fixes-script">
(function(){
'use strict';
var originalAuthFields=typeof authFields==='function'?authFields:null;

    }

  };
}
function apiEditorOpen(){
  return typeof state!=='undefined'&&state.editor&&state.editor.kind==='api';
}
function normalizePosition(value){
  var key=String(value||'Header').toLowerCase();
  return key==='query'?'Query':key==='body'?'Body':key==='path'?'Path':'Header';
}
function arrangeApiCards(){
  if(!apiEditorOpen())return;
  var root=document.querySelector('#drawerBody');
  if(!root)return;
  var requestCard=Array.from(root.querySelectorAll('.section-card')).find(function(section){
    var title=section.querySelector('.section-title');
    return title&&title.textContent.trim()==='请求配置';
  });
  var authCard=root.querySelector('.api-auth-master');
  var schemaCard=root.querySelector('.api-schema-section');
  if(requestCard&&authCard&&requestCard.nextElementSibling!==authCard){
    requestCard.insertAdjacentElement('afterend',authCard);

    authCard.insertAdjacentElement('afterend',schemaCard);
  }
  root.querySelectorAll('.api-auth-master [data-api-auth-row]').forEach(function(row){

    var valueInput=row.querySelector('input[data-auth-input="defaultValue"]');
    var param=state.editor.data.authParams&&state.editor.data.authParams[index];
    if(select){
      var current=normalizePosition(param?param.position:select.value);

      if(select.dataset.positionOptions!=='all'){
        select.innerHTML=['Query','Body','Header','Path'].map(function(item){return '<option value="'+item+'" '+(item===current?'selected':'')+'>'+item+'</option>';}).join('');
        select.dataset.positionOptions='all';

        select.value=current;
      }
    }
    if(checkbox&&valueInput&&checkbox.checked){
      valueInput.value='';
      valueInput.placeholder='由客户端填写';
      valueInput.disabled=true;
      if(param)param.defaultValue='';
    }
  });
  var apiBearer=root.querySelector('.api-auth-bearer-row input[data-api-bearer-token]');
  if(apiBearer)apiBearer.placeholder='粘贴Bearer Token（不含Bearer前缀）';

}

})();
